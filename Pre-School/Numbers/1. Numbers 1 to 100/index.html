    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback, useMemo } = React;

      /* ========================================================================
       * 1. SOUND & AUDIO ENGINE (Web Audio API & Web Speech)
       * ======================================================================== */
      let audioCtx = null;
      function getAudioContext() {
        try {
          if (!audioCtx && typeof window !== 'undefined') {
            const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
            if (AudioCtxClass) audioCtx = new AudioCtxClass();
          }
          if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
          return audioCtx;
        } catch { return null; }
      }

      function playDotPopSound() {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(840, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } catch {}
      }

      function playSuccessChime() {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const start = now + idx * 0.09;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(0.25, start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(start);
            osc.stop(start + 0.35);
          });
        } catch {}
      }

      function speakText(text, lang = 'en-US') {
        try {
          if (typeof window === 'undefined' || !('speechSynthesis' in window)) return;
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = lang;
          u.rate = 0.9;
          u.pitch = 1.1;
          window.speechSynthesis.speak(u);
        } catch {}
      }

      /* ========================================================================
       * 2. NUMBER ENGINE (1 to 100, Hindi Words, Devanagari, Objects)
       * ======================================================================== */
      const ALL_HINDI_WORDS = [
        '',
        'एक', 'दो', 'तीन', 'चार', 'पाँच', 'छह', 'सात', 'आठ', 'नौ', 'दस',
        'ग्यारह', 'बारह', 'तेरह', 'चौदह', 'पंद्रह', 'सोलह', 'सत्रह', 'अठारह', 'उन्नीस', 'बीस',
        'इक्कीस', 'बाईस', 'तेईस', 'चौबीस', 'पच्चीस', 'छब्बीस', 'सत्ताईस', 'अट्ठाईस', 'उनतीस', 'तीस',
        'इकत्तीस', 'बत्तीस', 'तैंतीस', 'चौंतीस', 'पैंतीस', 'छत्तीस', 'सैंतीस', 'अड़तीस', 'उनतालीस', 'चालीस',
        'इकतालीस', 'बयालीस', 'तैंतालीस', 'चवालीस', 'पैंतालीस', 'छियालीस', 'सैंतालीस', 'अड़तालीस', 'उनचास', 'पचास',
        'इक्यावन', 'बावन', 'तिरपन', 'चौवन', 'पचपन', 'छप्पन', 'सत्तावन', 'अट्ठावन', 'उनसठ', 'साठ',
        'इकसठ', 'बासठ', 'तिरसठ', 'चौंसठ', 'पैंसठ', 'छियासठ', 'सरसठ', 'अड़सठ', 'उनहत्तर', 'सत्तर',
        'इकहत्तर', 'बहत्तर', 'तिहत्तर', 'चौहत्तर', 'पचहत्तर', 'छिहत्तर', 'सतहत्तर', 'अठहत्तर', 'उन्यासी', 'अस्सी',
        'इक्यासी', 'बयासी', 'तिरासी', 'चौरासी', 'पचासी', 'छियासी', 'सत्तासी', 'अट्ठासी', 'नवासी', 'नब्बे',
        'इक्यानवे', 'बानवे', 'तिरानवे', 'चौरानवे', 'पचानवे', 'छियानवे', 'सत्तानवे', 'अट्ठानवे', 'निन्यानवे', 'सौ',
      ];

      const ONES_WORDS = [
        '', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine',
        'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen',
        'Seventeen', 'Eighteen', 'Nineteen',
      ];

      const TENS_WORDS = [
        '', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety',
      ];

      function numberToWords(n) {
        if (n === 100) return 'One Hundred';
        if (n < 20) return ONES_WORDS[n] || String(n);
        const tens = Math.floor(n / 10);
        const rem = n % 10;
        if (rem === 0) return TENS_WORDS[tens];
        return `${TENS_WORDS[tens]}-${ONES_WORDS[rem]}`;
      }

      function numberToDevanagari(n) {
        const digits = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];
        return String(n).split('').map((d) => digits[Number(d)] || d).join('');
      }

      const SELECTABLE_OBJECTS = [
        { id: 'apple', nameEn: 'Apple', namePluralEn: 'Apples', nameHi: 'सेब', color: '#ef4444' },
        { id: 'banana', nameEn: 'Banana', namePluralEn: 'Bananas', nameHi: 'केले', color: '#eab308' },
        { id: 'carrot', nameEn: 'Carrot', namePluralEn: 'Carrots', nameHi: 'गाजरें', color: '#f97316' },
        { id: 'orange', nameEn: 'Orange', namePluralEn: 'Oranges', nameHi: 'संतरे', color: '#ea580c' },
        { id: 'heart', nameEn: 'Heart', namePluralEn: 'Hearts', nameHi: 'दिल', color: '#f43f5e' },
        { id: 'sun', nameEn: 'Sun', namePluralEn: 'Suns', nameHi: 'सूरज', color: '#f59e0b' },
        { id: 'milk', nameEn: 'Milk Glass', namePluralEn: 'Milk Glasses', nameHi: 'दूध गिलास', color: '#38bdf8' },
        { id: 'toothbrush', nameEn: 'Toothbrush', namePluralEn: 'Toothbrushes', nameHi: 'टूथब्रश', color: '#06b6d4' },
        { id: 'salad', nameEn: 'Salad Bowl', namePluralEn: 'Salad Bowls', nameHi: 'सलाद कटोरे', color: '#22c55e' },
        { id: 'moon', nameEn: 'Moon', namePluralEn: 'Moons', nameHi: 'चाँद', color: '#a855f7' },
        { id: 'earth', nameEn: 'Earth', namePluralEn: 'Earths', nameHi: 'धरती', color: '#0284c7' },
        { id: 'trophy', nameEn: 'Trophy', namePluralEn: 'Trophies', nameHi: 'ट्रॉफियां', color: '#ca8a04' },
      ];

      function getNumberContext(n) {
        const wordEn = numberToWords(n);
        const wordEnUpper = wordEn.toUpperCase();
        const wordHi = ALL_HINDI_WORDS[n] || `संख्या ${n}`;
        const deva = numberToDevanagari(n);
        const tens = Math.floor(n / 10);
        const ones = n % 10;
        return { number: n, wordEn, wordEnUpper, wordHi, deva, tens, ones };
      }

      /* ========================================================================
       * 3. GEOMETRY ENGINE (4 Handwriting Lines, Wide 28px Letter Gap)
       * ======================================================================== */
      const Y_TOP_1 = 38;
      const Y_MID_1 = 84;
      const Y_BASE_1 = 134;
      const Y_BOT_1 = 158;

      const Y_TOP_2 = 186;
      const Y_MID_2 = 232;
      const Y_BASE_2 = 282;
      const Y_BOT_2 = 306;

      function linePoints(x1, y1, x2, y2, steps, g) {
        const pts = [];
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          pts.push({
            x: Math.round((x1 + (x2 - x1) * t) * 10) / 10,
            y: Math.round((y1 + (y2 - y1) * t) * 10) / 10,
            g,
          });
        }
        return pts;
      }

      function ellipsePoints(cx, cy, rx, ry, steps, g) {
        const pts = [];
        for (let i = 0; i < steps; i++) {
          const angle = (i / steps) * Math.PI * 2 - Math.PI / 2;
          pts.push({
            x: Math.round((cx + Math.cos(angle) * rx) * 10) / 10,
            y: Math.round((cy + Math.sin(angle) * ry) * 10) / 10,
            g,
          });
        }
        return pts;
      }

      function getDigitData(digit, cx, w = 56, groupOffset = 1, yTop = Y_TOP_1, yBase = Y_BASE_1) {
        const left = cx - w / 2;
        const right = cx + w / 2;
        const pts = [];
        const mid = (yTop + yBase) / 2;

        switch (digit) {
          case '1': {
            const p = `M ${cx - 16} ${yTop + 26} L ${cx} ${yTop} L ${cx} ${yBase} M ${cx - 20} ${yBase} L ${cx + 20} ${yBase}`;
            pts.push(...linePoints(cx - 16, yTop + 26, cx, yTop, 2, groupOffset));
            pts.push(...linePoints(cx, yTop, cx, yBase, 7, groupOffset));
            pts.push(...linePoints(cx - 20, yBase, cx + 20, yBase, 3, groupOffset + 1));
            return { path: p, points: pts };
          }
          case '2': {
            const p = `M ${left} ${yTop + 26} C ${left} ${yTop}, ${right} ${yTop}, ${right} ${yTop + 34} C ${right} ${yTop + 60}, ${left + 4} ${yBase - 18}, ${left} ${yBase} L ${right} ${yBase}`;
            pts.push({ x: left, y: yTop + 26, g: groupOffset });
            pts.push({ x: cx - 12, y: yTop + 8, g: groupOffset });
            pts.push({ x: cx, y: yTop, g: groupOffset });
            pts.push({ x: right - 6, y: yTop + 12, g: groupOffset });
            pts.push({ x: right, y: yTop + 34, g: groupOffset });
            pts.push({ x: right - 8, y: yTop + 56, g: groupOffset });
            pts.push({ x: cx, y: yTop + 76, g: groupOffset });
            pts.push({ x: left + 8, y: yBase - 10, g: groupOffset });
            pts.push({ x: left, y: yBase, g: groupOffset });
            pts.push(...linePoints(left, yBase, right, yBase, 5, groupOffset + 1));
            return { path: p, points: pts };
          }
          case '3': {
            const p = `M ${left} ${yTop + 16} C ${left} ${yTop}, ${right} ${yTop}, ${right} ${yTop + 30} C ${right} ${mid - 4}, ${cx + 6} ${mid}, ${cx} ${mid} C ${right} ${mid}, ${right} ${yBase - 18}, ${right} ${yBase - 12} C ${right} ${yBase}, ${left} ${yBase}, ${left} ${yBase - 12}`;
            pts.push({ x: left, y: yTop + 16, g: groupOffset });
            pts.push({ x: cx, y: yTop, g: groupOffset });
            pts.push({ x: right, y: yTop + 30, g: groupOffset });
            pts.push({ x: cx, y: mid, g: groupOffset });
            pts.push({ x: right, y: yBase - 26, g: groupOffset + 1 });
            pts.push({ x: cx, y: yBase, g: groupOffset + 1 });
            pts.push({ x: left, y: yBase - 12, g: groupOffset + 1 });
            return { path: p, points: pts };
          }
          case '4': {
            const stemX = right - 12;
            const barY = yTop + 68;
            const p = `M ${cx} ${yTop} L ${left} ${barY} L ${right} ${barY} M ${stemX} ${yTop + 8} L ${stemX} ${yBase}`;
            pts.push(...linePoints(cx, yTop, left, barY, 5, groupOffset));
            pts.push(...linePoints(left, barY, right, barY, 4, groupOffset));
            pts.push(...linePoints(stemX, yTop + 8, stemX, yBase, 6, groupOffset + 1));
            return { path: p, points: pts };
          }
          case '5': {
            const p = `M ${right} ${yTop} L ${left + 6} ${yTop} L ${left + 4} ${yTop + 46} C ${left + 10} ${yTop + 42}, ${right} ${yTop + 42}, ${right} ${yTop + 70} C ${right} ${yBase - 2}, ${left + 6} ${yBase}, ${left} ${yBase - 10}`;
            pts.push(...linePoints(right, yTop, left + 6, yTop, 3, groupOffset));
            pts.push(...linePoints(left + 6, yTop, left + 4, yTop + 46, 3, groupOffset));
            pts.push({ x: cx, y: yTop + 44, g: groupOffset + 1 });
            pts.push({ x: right, y: yTop + 68, g: groupOffset + 1 });
            pts.push({ x: cx, y: yBase, g: groupOffset + 1 });
            pts.push({ x: left, y: yBase - 10, g: groupOffset + 1 });
            return { path: p, points: pts };
          }
          case '6': {
            const p = `M ${right - 4} ${yTop + 12} C ${left} ${yTop + 14}, ${left} ${yTop + 72}, ${left} ${yTop + 80} C ${left} ${yBase}, ${right} ${yBase}, ${right} ${yTop + 74} C ${right} ${yTop + 50}, ${left} ${yTop + 50}, ${left} ${yTop + 74}`;
            pts.push({ x: right - 4, y: yTop + 12, g: groupOffset });
            pts.push({ x: left + 6, y: yTop + 32, g: groupOffset });
            pts.push({ x: left, y: yTop + 58, g: groupOffset });
            pts.push({ x: left, y: yTop + 80, g: groupOffset });
            pts.push({ x: cx, y: yBase, g: groupOffset + 1 });
            pts.push({ x: right, y: yTop + 74, g: groupOffset + 1 });
            pts.push({ x: cx, y: yTop + 52, g: groupOffset + 1 });
            pts.push({ x: left, y: yTop + 74, g: groupOffset + 1 });
            return { path: p, points: pts };
          }
          case '7': {
            const p = `M ${left} ${yTop} L ${right} ${yTop} L ${left + 10} ${yBase}`;
            pts.push(...linePoints(left, yTop, right, yTop, 4, groupOffset));
            pts.push(...linePoints(right, yTop, left + 10, yBase, 7, groupOffset + 1));
            return { path: p, points: pts };
          }
          case '8': {
            const p = `M ${cx} ${mid} C ${left} ${mid}, ${left} ${yTop}, ${cx} ${yTop} C ${right} ${yTop}, ${right} ${mid}, ${cx} ${mid} C ${left} ${mid}, ${left} ${yBase}, ${cx} ${yBase} C ${right} ${yBase}, ${right} ${mid}, ${cx} ${mid}`;
            pts.push({ x: cx, y: mid, g: groupOffset });
            pts.push({ x: left + 4, y: yTop + 24, g: groupOffset });
            pts.push({ x: cx, y: yTop, g: groupOffset });
            pts.push({ x: right - 4, y: yTop + 24, g: groupOffset });
            pts.push({ x: cx, y: mid, g: groupOffset });
            pts.push({ x: left + 2, y: yBase - 24, g: groupOffset + 1 });
            pts.push({ x: cx, y: yBase, g: groupOffset + 1 });
            pts.push({ x: right - 2, y: yBase - 24, g: groupOffset + 1 });
            return { path: p, points: pts };
          }
          case '9': {
            const p = `M ${right} ${yTop + 30} C ${right} ${yTop + 6}, ${left} ${yTop + 6}, ${left} ${yTop + 30} C ${left} ${yTop + 56}, ${right} ${yTop + 56}, ${right} ${yTop + 30} L ${right} ${yBase - 12} C ${right} ${yBase}, ${left + 4} ${yBase}, ${left} ${yBase - 12}`;
            pts.push({ x: right, y: yTop + 30, g: groupOffset });
            pts.push({ x: cx, y: yTop + 6, g: groupOffset });
            pts.push({ x: left, y: yTop + 30, g: groupOffset });
            pts.push({ x: cx, y: yTop + 54, g: groupOffset });
            pts.push({ x: right, y: yTop + 30, g: groupOffset });
            pts.push(...linePoints(right, yTop + 36, right, yBase - 12, 4, groupOffset + 1));
            pts.push({ x: cx, y: yBase, g: groupOffset + 1 });
            pts.push({ x: left, y: yBase - 12, g: groupOffset + 1 });
            return { path: p, points: pts };
          }
          case '0':
          default: {
            const rx = w / 2;
            const ry = (yBase - yTop) / 2;
            const cy = (yBase + yTop) / 2;
            const p = `M ${cx} ${yTop} C ${left} ${yTop}, ${left} ${yBase}, ${cx} ${yBase} C ${right} ${yBase}, ${right} ${yTop}, ${cx} ${yTop} Z`;
            pts.push(...ellipsePoints(cx, cy, rx, ry, 9, groupOffset));
            return { path: p, points: pts };
          }
        }
      }

      function getCapitalLetterData(char, cx, w, group, yTop = Y_TOP_1, yBase = Y_BASE_1) {
        const c = char.toUpperCase();
        const left = cx - w / 2;
        const right = cx + w / 2;
        const mid = (yTop + yBase) / 2;
        const pts = [];
        let path = '';

        switch (c) {
          case '-':
            path = `M ${left + 4} ${mid} L ${right - 4} ${mid}`;
            pts.push(...linePoints(left + 4, mid, right - 4, mid, 3, group));
            break;
          case 'A':
            path = `M ${left} ${yBase} L ${cx} ${yTop} L ${right} ${yBase} M ${left + w * 0.22} ${mid + 8} L ${right - w * 0.22} ${mid + 8}`;
            pts.push(...linePoints(left, yBase, cx, yTop, 5, group));
            pts.push(...linePoints(cx, yTop, right, yBase, 5, group));
            pts.push(...linePoints(left + w * 0.22, mid + 8, right - w * 0.22, mid + 8, 3, group + 1));
            break;
          case 'B':
            path = `M ${left} ${yTop} L ${left} ${yBase} M ${left} ${yTop} C ${right} ${yTop}, ${right} ${mid}, ${left} ${mid} C ${right + 2} ${mid}, ${right + 2} ${yBase}, ${left} ${yBase}`;
            pts.push(...linePoints(left, yTop, left, yBase, 5, group));
            pts.push(...ellipsePoints(cx, (yTop + mid) / 2, w / 2, (mid - yTop) / 2, 4, group + 1));
            pts.push(...ellipsePoints(cx, (mid + yBase) / 2, w / 2, (yBase - mid) / 2, 4, group + 1));
            break;
          case 'C':
            path = `M ${right} ${yTop + 18} C ${right} ${yTop}, ${left} ${yTop}, ${left} ${mid} C ${left} ${yBase}, ${right} ${yBase}, ${right} ${yBase - 16}`;
            pts.push({ x: right, y: yTop + 18, g: group });
            pts.push({ x: cx, y: yTop, g: group });
            pts.push({ x: left, y: mid, g: group });
            pts.push({ x: cx, y: yBase, g: group });
            pts.push({ x: right, y: yBase - 16, g: group });
            break;
          case 'D':
            path = `M ${left} ${yTop} L ${left} ${yBase} M ${left} ${yTop} C ${right + 3} ${yTop}, ${right + 3} ${yBase}, ${left} ${yBase}`;
            pts.push(...linePoints(left, yTop, left, yBase, 5, group));
            pts.push(...ellipsePoints(cx, mid, w / 2, (yBase - yTop) / 2, 6, group + 1));
            break;
          case 'E':
            path = `M ${left} ${yTop} L ${left} ${yBase} M ${left} ${yTop} L ${right} ${yTop} M ${left} ${mid} L ${right - 6} ${mid} M ${left} ${yBase} L ${right} ${yBase}`;
            pts.push(...linePoints(left, yTop, left, yBase, 5, group));
            pts.push(...linePoints(left, yTop, right, yTop, 3, group));
            pts.push(...linePoints(left, mid, right - 6, mid, 2, group));
            pts.push(...linePoints(left, yBase, right, yBase, 3, group));
            break;
          case 'F':
            path = `M ${left} ${yTop} L ${left} ${yBase} M ${left} ${yTop} L ${right} ${yTop} M ${left} ${mid} L ${right - 6} ${mid}`;
            pts.push(...linePoints(left, yTop, left, yBase, 5, group));
            pts.push(...linePoints(left, yTop, right, yTop, 3, group));
            pts.push(...linePoints(left, mid, right - 6, mid, 2, group));
            break;
          case 'G':
            path = `M ${right} ${yTop + 18} C ${right} ${yTop}, ${left} ${yTop}, ${left} ${mid} C ${left} ${yBase}, ${right} ${yBase}, ${right} ${mid} L ${cx} ${mid}`;
            pts.push({ x: right, y: yTop + 18, g: group });
            pts.push({ x: cx, y: yTop, g: group });
            pts.push({ x: left, y: mid, g: group });
            pts.push({ x: cx, y: yBase, g: group });
            pts.push(...linePoints(right, yBase, right, mid, 3, group + 1));
            pts.push(...linePoints(right, mid, cx, mid, 2, group + 1));
            break;
          case 'H':
            path = `M ${left} ${yTop} L ${left} ${yBase} M ${right} ${yTop} L ${right} ${yBase} M ${left} ${mid} L ${right} ${mid}`;
            pts.push(...linePoints(left, yTop, left, yBase, 5, group));
            pts.push(...linePoints(right, yTop, right, yBase, 5, group));
            pts.push(...linePoints(left, mid, right, mid, 3, group + 1));
            break;
          case 'I':
            path = `M ${cx} ${yTop} L ${cx} ${yBase} M ${left + 4} ${yTop} L ${right - 4} ${yTop} M ${left + 4} ${yBase} L ${right - 4} ${yBase}`;
            pts.push(...linePoints(cx, yTop, cx, yBase, 6, group));
            pts.push(...linePoints(left + 4, yTop, right - 4, yTop, 2, group));
            pts.push(...linePoints(left + 4, yBase, right - 4, yBase, 2, group));
            break;
          case 'J':
            path = `M ${right} ${yTop} L ${right} ${yBase - 18} C ${right} ${yBase}, ${left} ${yBase}, ${left} ${yBase - 18}`;
            pts.push(...linePoints(right, yTop, right, yBase - 18, 5, group));
            pts.push({ x: cx, y: yBase, g: group });
            pts.push({ x: left, y: yBase - 18, g: group });
            break;
          case 'K':
            path = `M ${left} ${yTop} L ${left} ${yBase} M ${right} ${yTop} L ${left} ${mid} L ${right} ${yBase}`;
            pts.push(...linePoints(left, yTop, left, yBase, 5, group));
            pts.push(...linePoints(right, yTop, left, mid, 4, group + 1));
            pts.push(...linePoints(left, mid, right, yBase, 4, group + 1));
            break;
          case 'L':
            path = `M ${left} ${yTop} L ${left} ${yBase} L ${right} ${yBase}`;
            pts.push(...linePoints(left, yTop, left, yBase, 5, group));
            pts.push(...linePoints(left, yBase, right, yBase, 4, group + 1));
            break;
          case 'M':
            path = `M ${left} ${yBase} L ${left} ${yTop} L ${cx} ${mid + 8} L ${right} ${yTop} L ${right} ${yBase}`;
            pts.push(...linePoints(left, yBase, left, yTop, 5, group));
            pts.push(...linePoints(left, yTop, cx, mid + 8, 4, group));
            pts.push(...linePoints(cx, mid + 8, right, yTop, 4, group));
            pts.push(...linePoints(right, yTop, right, yBase, 5, group));
            break;
          case 'N':
            path = `M ${left} ${yBase} L ${left} ${yTop} L ${right} ${yBase} L ${right} ${yTop}`;
            pts.push(...linePoints(left, yBase, left, yTop, 5, group));
            pts.push(...linePoints(left, yTop, right, yBase, 5, group));
            pts.push(...linePoints(right, yBase, right, yTop, 5, group));
            break;
          case 'O':
            path = `M ${cx} ${yTop} C ${left} ${yTop}, ${left} ${yBase}, ${cx} ${yBase} C ${right} ${yBase}, ${right} ${yTop}, ${cx} ${yTop} Z`;
            pts.push(...ellipsePoints(cx, mid, w / 2, (yBase - yTop) / 2, 8, group));
            break;
          case 'P':
            path = `M ${left} ${yTop} L ${left} ${yBase} M ${left} ${yTop} C ${right + 2} ${yTop}, ${right + 2} ${mid}, ${left} ${mid}`;
            pts.push(...linePoints(left, yTop, left, yBase, 5, group));
            pts.push(...ellipsePoints(cx, (yTop + mid) / 2, w / 2, (mid - yTop) / 2, 5, group + 1));
            break;
          case 'Q':
            path = `M ${cx} ${yTop} C ${left} ${yTop}, ${left} ${yBase}, ${cx} ${yBase} C ${right} ${yBase}, ${right} ${yTop}, ${cx} ${yTop} Z M ${cx} ${yBase - 18} L ${right + 4} ${yBase}`;
            pts.push(...ellipsePoints(cx, mid, w / 2, (yBase - yTop) / 2, 8, group));
            pts.push(...linePoints(cx, yBase - 18, right + 4, yBase, 3, group + 1));

          case 'R':

            pts.push(...linePoints(left, yTop, left, yBase, 5, group));
            pts.push(...ellipsePoints(cx, (yTop + mid) / 2, w / 2, (mid - yTop) / 2, 4, group + 1));
            pts.push(...linePoints(left, mid, right, yBase, 4, group + 1));
            break;
          case 'S':
            path = `M ${right} ${yTop + 18} C ${right} ${yTop}, ${left} ${yTop}, ${left} ${yTop + 30} C ${left} ${mid}, ${right} ${mid}, ${right} ${yBase - 28} C ${right} ${yBase}, ${left} ${yBase}, ${left} ${yBase - 16}`;
            pts.push({ x: right, y: yTop + 18, g: group });
            pts.push({ x: cx, y: yTop, g: group });
            pts.push({ x: left, y: yTop + 30, g: group });
            pts.push({ x: cx, y: mid, g: group });
            pts.push({ x: right, y: yBase - 28, g: group });
            pts.push({ x: cx, y: yBase, g: group });
            pts.push({ x: left, y: yBase - 16, g: group });
            break;
          case 'T':
            path = `M ${left} ${yTop} L ${right} ${yTop} M ${cx} ${yTop} L ${cx} ${yBase}`;
            pts.push(...linePoints(left, yTop, right, yTop, 4, group));
            pts.push(...linePoints(cx, yTop, cx, yBase, 6, group));
            break;
          case 'U':
            path = `M ${left} ${yTop} L ${left} ${yBase - 18} C ${left} ${yBase}, ${right} ${yBase}, ${right} ${yBase - 18} L ${right} ${yTop}`;
            pts.push(...linePoints(left, yTop, left, yBase - 18, 4, group));
            pts.push({ x: cx, y: yBase, g: group });
            pts.push(...linePoints(right, yBase - 18, right, yTop, 4, group));
            break;
          case 'V':

            pts.push(...linePoints(right - w * 0.28, yBase, right, yTop, 4, group));
            break;
          case 'X':
            path = `M ${left} ${yTop} L ${right} ${yBase} M ${right} ${yTop} L ${left} ${yBase}`;
            pts.push(...linePoints(left, yTop, right, yBase, 5, group));
            pts.push(...linePoints(right, yTop, left, yBase, 5, group + 1));
            break;
          case 'Y':
            path = `M ${left} ${yTop} L ${cx} ${mid} L ${right} ${yTop} M ${cx} ${mid} L ${cx} ${yBase}`;
            pts.push(...linePoints(left, yTop, cx, mid, 4, group));
            pts.push(...linePoints(right, yTop, cx, mid, 4, group));
            pts.push(...linePoints(cx, mid, cx, yBase, 5, group + 1));
            break;
          case 'Z':
            path = `M ${left} ${yTop} L ${right} ${yTop} L ${left} ${yBase} L ${right} ${yBase}`;
            pts.push(...linePoints(left, yTop, right, yTop, 4, group));
            pts.push(...linePoints(right, yTop, left, yBase, 5, group + 1));
            pts.push(...linePoints(left, yBase, right, yBase, 4, group + 1));
            break;
          default:
            path = `M ${left} ${yTop} L ${left} ${yBase} L ${right} ${yBase} L ${right} ${yTop} Z`;
            pts.push(...linePoints(left, yTop, left, yBase, 4, group));
            pts.push(...linePoints(right, yBase, right, yTop, 4, group));
        }

        return { path, points: pts };
      }

      function getWordGeometry(word, minWidth = 360) {
        const cleanWord = word.toUpperCase().replace(/\s+/g, '-');
        const parts = cleanWord.split('-').filter(Boolean);
        const charWidth = 46;
        const gap = 28;

        if (parts.length <= 1) {
          const chars = cleanWord.split('');
          const count = chars.length;
          const blockWidth = count * charWidth + (count - 1) * gap;
          const widthNeeded = Math.max(minWidth, blockWidth + 60);
          const startX = (widthNeeded - blockWidth) / 2 + charWidth / 2;
          let combinedPath = '';
          const combinedPoints = [];

          chars.forEach((char, i) => {
            const cx = startX + i * (charWidth + gap);
            const { path, points } = getCapitalLetterData(char, cx, char === '-' ? 20 : charWidth, (i + 1) * 2, Y_TOP_1, Y_BASE_1);
            combinedPath += (combinedPath ? ' ' : '') + path;
            combinedPoints.push(...points);
          });

          return { path: combinedPath, points: combinedPoints, widthNeeded, heightNeeded: 190 };
        }

        const word1 = parts[0];
        const word2 = parts.slice(1).join('-');
        const chars1 = word1.split('');
        const chars2 = word2.split('');
        const w1Block = chars1.length * charWidth + (chars1.length - 1) * gap;
        const w2Block = chars2.length * charWidth + (chars2.length - 1) * gap;
        const widthNeeded = Math.max(minWidth, Math.max(w1Block, w2Block) + 70);
        const startX1 = (widthNeeded - w1Block) / 2 + charWidth / 2;
        const startX2 = (widthNeeded - w2Block) / 2 + charWidth / 2;

        let combinedPath = '';
        const combinedPoints = [];

        chars1.forEach((char, i) => {
          const cx = startX1 + i * (charWidth + gap);
          const { path, points } = getCapitalLetterData(char, cx, charWidth, (i + 1) * 2, Y_TOP_1, Y_BASE_1);
          combinedPath += (combinedPath ? ' ' : '') + path;
          combinedPoints.push(...points);
        });

        chars2.forEach((char, i) => {
          const cx = startX2 + i * (charWidth + gap);
          const { path, points } = getCapitalLetterData(char, cx, charWidth, (chars1.length + i + 1) * 2, Y_TOP_2, Y_BASE_2);
          combinedPath += (combinedPath ? ' ' : '') + path;
          combinedPoints.push(...points);
        });

        return { path: combinedPath, points: combinedPoints, widthNeeded, heightNeeded: 330 };
      }

      function getNumberSequenceData(numStr, totalWidth = 300) {
        const digits = numStr.split('');
        const count = digits.length;
        let digitWidth = 56;
        let gap = 26;

        if (count === 3) { digitWidth = 48; gap = 20; }
        else if (count === 2) { digitWidth = 56; gap = 26; }
        else { digitWidth = 64; }

        const blockWidth = count * digitWidth + (count - 1) * gap;
        const widthNeeded = Math.max(totalWidth, blockWidth + 60);
        const startX = (widthNeeded - blockWidth) / 2 + digitWidth / 2;

        let combinedPath = '';
        const combinedPoints = [];

        digits.forEach((d, i) => {
          const cx = startX + i * (digitWidth + gap);
          const { path, points } = getDigitData(d, cx, digitWidth, (i + 1) * 3);
          combinedPath += (combinedPath ? ' ' : '') + path;
          combinedPoints.push(...points);
        });

        return { path: combinedPath, points: combinedPoints };
      }

      const ExactObjectsLab = ({ currentNumber, selectedObject, onSelectObject }) => {

        useEffect(() => {
          setCountedSet(new Set());
        }, [currentNumber, selectedObject.id]);

        const handleTapItem = (idx) => {
          const num = idx + 1;
          setCountedSet((prev) => {
            const next = new Set(prev);
            if (next.has(num)) next.delete(num);
            else {
              next.add(num);
              playDotPopSound();
              if (num === currentNumber) {
                playSuccessChime();
                speakText(`All ${currentNumber} counted! Great job!`, 'en-US');
              } else {
                speakText(String(num), 'en-US');
              }
            }
            return next;
          });
        };

        const totalRows = Math.ceil(currentNumber / 10);
        const rows = [];
        for (let r = 0; r < totalRows; r++) {
          const start = r * 10;
          const end = Math.min(start + 10, currentNumber);
          const row = [];
          for (let i = start; i < end; i++) row.push(i);
          rows.push(row);
        }

                      speakText(`Exactly ${currentNumber} ${currentNumber === 1 ? selectedObject.nameEn : selectedObject.namePluralEn}! ${ctx.wordEn}!`, 'en-US');
                    }}
                    className="bg-[#10b981] hover:bg-[#059669] text-white px-3.5 py-1.5 rounded-xl text-xs font-[800] shadow-xs transition-transform active:scale-95"
                  >
                    ✓ Count All
                  </button>
                  <button
                    type="button"
                    onClick={() => { setCountedSet(new Set()); playDotPopSound(); }}
                    className="border border-[#cbd5e1] bg-white hover:bg-slate-50 text-[#475569] px-2.5 py-1.5 rounded-xl text-xs font-[700]"
                  >
                    ↺ Reset
                  </button>
                </div>
              </div>

              <div className="flex flex-col gap-4 max-h-[550px] overflow-y-auto pr-1">
                {rows.map((row, rIdx) => (
                  <div key={rIdx} className="bg-[#fafaf9] border-2 border-dashed border-[#e7e5e4] rounded-2xl p-3 sm:p-4 flex flex-col gap-2">
                    {currentNumber > 10 && (
                      <div className="flex justify-between items-center text-[11px] font-[800] text-[#78716c] uppercase font-['Outfit',sans-serif]">
                        <span>{`Group ${rIdx + 1} (${rIdx * 10 + 1} to ${Math.min((rIdx + 1) * 10, currentNumber)})`}</span>
                        <span>{row.length} {selectedObject.namePluralEn}</span>
                      </div>
                    )}
                    <div className="grid grid-cols-5 sm:grid-cols-10 gap-2 sm:gap-2.5">
                      {row.map((itemIdx) => {
                        const itemNum = itemIdx + 1;
                        const isCounted = countedSet.has(itemNum);
                        return (
                          <button
                            key={itemNum}
                            type="button"
                            onClick={() => handleTapItem(itemIdx)}
                            className={`aspect-square rounded-2xl p-1.5 flex flex-col items-center justify-center transition-all relative ${
                              isCounted
                                ? 'bg-[#dcfce7] border-[2.5px] border-[#10b981] shadow-md scale-105'
                                : 'bg-white border-2 border-[#cbd5e1] hover:border-[#10b981] hover:scale-102'
                            }`}
                            title={`Item #${itemNum}`}
                          >
                            <IllustrationObject type={selectedObject.id} size={38} />
                            <span className={`text-[10px] font-[900] font-['Outfit',sans-serif] px-1 rounded-md mt-0.5 leading-none ${
                              isCounted ? 'bg-[#059669] text-white' : 'bg-slate-100 text-[#475569]'
                            }`}>
                              #{itemNum}
                            </span>
                            {isCounted && (
                              <span className="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-[#10b981] text-white text-[10px] grid place-items-center font-bold">
                                ✓
                              </span>
                            )}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>
        );
      };

      /* ========================================================================
       * 10. STRICT OVERWRITING BOARD COMPONENT (>= 88% overall & 72% per part)
       * ======================================================================== */
      const OverwritingBox = ({
        id,
        pattern,
        targetNumber = 1,
        label,
        labelHi,
        theme,
        speakStr,
        isCompleted: externalCompleted,
        onComplete,
        onReset,
      }) => {
        const svgRef = useRef(null);
        const [covered, setCovered] = useState(new Set());
        const [userPath, setUserPath] = useState('');
        const [isDrawing, setIsDrawing] = useState(false);
        const [internalCompleted, setInternalCompleted] = useState(false);
        const lastPtRef = useRef(null);

        const numStr = String(targetNumber);
        const fullWordEn = numberToWords(targetNumber).toUpperCase().replace(/\s+/g, '-');

        const { path: patternPath, points: rawCheckpoints, widthNeeded, heightNeeded } = useMemo(() => {
          if (pattern === 'number-single' || pattern.includes('single') || pattern.includes('num')) {
            const data = getNumberSequenceData(numStr, 320);
            return { path: data.path, points: data.points, widthNeeded: Math.max(320, numStr.length * 70 + 80), heightNeeded: 190 };
          }
          return getWordGeometry(fullWordEn, 360);
        }, [pattern, targetNumber, numStr, fullWordEn]);

        const checkpoints = useMemo(() => {
          const filtered = [];
          rawCheckpoints.forEach((pt) => {
            if (!filtered.some((e) => Math.hypot(e.x - pt.x, e.y - pt.y) < 9)) {
              filtered.push(pt);
            }
          });
          return filtered.length > 0 ? filtered : [{ x: widthNeeded / 2, y: Y_MID_1, g: 1 }];
        }, [rawCheckpoints, widthNeeded]);

        useEffect(() => {
          setCovered(new Set());
          setUserPath('');
          setInternalCompleted(false);
          setIsDrawing(false);
          lastPtRef.current = null;
        }, [pattern, targetNumber]);

        const strokeWidth = 14;
        const isDone = externalCompleted || internalCompleted;
        const gradId = `grad_${id}_${targetNumber}`.replace(/[^a-zA-Z0-9_-]/g, '_');
        const isMultiLine = heightNeeded > 220;

        const triggerCompletion = useCallback(() => {
          setInternalCompleted(true);
          playSuccessChime();
          if (speakStr) speakText(speakStr, 'en-US');
          if (onComplete) onComplete();
        }, [speakStr, onComplete]);

        // STRICT COMPLETION: >= 88% overall AND all digit/letter parts >= 72%
        useEffect(() => {
          if (isDone || checkpoints.length === 0) return;
          const groupTotal = {};
          const groupCovered = {};

          checkpoints.forEach((pt, idx) => {
            groupTotal[pt.g] = (groupTotal[pt.g] || 0) + 1;
            if (covered.has(idx)) {
              groupCovered[pt.g] = (groupCovered[pt.g] || 0) + 1;
            }
          });

          const allPartsTraced = Object.keys(groupTotal).every((g) => {
            const gNum = Number(g);
            return (groupCovered[gNum] || 0) / groupTotal[gNum] >= 0.72;
          });

          const overallRatio = covered.size / checkpoints.length;

          if (overallRatio >= 0.88 && allPartsTraced) {
            triggerCompletion();
          }
        }, [covered, isDone, checkpoints, triggerCompletion]);

        const getSvgCoords = useCallback(
          (clientX, clientY) => {
            const svg = svgRef.current;
            if (!svg) return { x: 0, y: 0 };

            try {
              const pt = svg.createSVGPoint();
              pt.x = clientX;
              pt.y = clientY;
              const ctm = svg.getScreenCTM();
              if (ctm) {
                const trans = pt.matrixTransform(ctm.inverse());
                if (Number.isFinite(trans.x) && Number.isFinite(trans.y)) {
                  return { x: Math.round(trans.x * 10) / 10, y: Math.round(trans.y * 10) / 10 };
                }
              }
            } catch {}

            const rect = svg.getBoundingClientRect();
            const vbW = widthNeeded;
            const vbH = heightNeeded;
            const boxAspect = rect.width / rect.height;
            const vbAspect = vbW / vbH;

            let actualW = rect.width;
            let actualH = rect.height;
            let offX = 0;
            let offY = 0;

            if (boxAspect > vbAspect) {
              actualW = rect.height * vbAspect;
              offX = (rect.width - actualW) / 2;
            } else {
              actualH = rect.width / vbAspect;
              offY = (rect.height - actualH) / 2;
            }

            const clampedX = Math.max(rect.left + offX, Math.min(rect.left + offX + actualW, clientX));
            const clampedY = Math.max(rect.top + offY, Math.min(rect.top + offY + actualH, clientY));

            const x = ((clampedX - (rect.left + offX)) / actualW) * vbW;
            const y = ((clampedY - (rect.top + offY)) / actualH) * vbH;

            return { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 };
          },
          [widthNeeded, heightNeeded]
        );

        const markHits = useCallback(
          (from, to) => {
            const rad = 15;
            const dist = Math.hypot(to.x - from.x, to.y - from.y);
            const steps = Math.max(1, Math.ceil(dist / 3.5));

            setCovered((prev) => {
              const next = new Set(prev);
              let hitNew = false;
              for (let s = 0; s <= steps; s++) {
                const t = s / steps;
                const px = from.x + (to.x - from.x) * t;
                const py = from.y + (to.y - from.y) * t;
                checkpoints.forEach((pt, idx) => {
                  if (!next.has(idx) && Math.hypot(pt.x - px, pt.y - py) <= rad) {
                    next.add(idx);
                    hitNew = true;
                  }
                });
              }
              if (hitNew) playDotPopSound();
              return next;
            });
          },
          [checkpoints]
        );

        const handlePointerDown = (e) => {
          if (isDone) return;
          e.preventDefault();
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
          const pt = getSvgCoords(e.clientX, e.clientY);
          setIsDrawing(true);
          lastPtRef.current = pt;
          setUserPath((prev) => prev + ` M ${pt.x} ${pt.y} L ${pt.x + 0.1} ${pt.y + 0.1}`);
          markHits(pt, pt);
        };

        const handlePointerMove = (e) => {
          if (!isDrawing || isDone) return;
          e.preventDefault();
          const pt = getSvgCoords(e.clientX, e.clientY);
          const prev = lastPtRef.current || pt;
          setUserPath((p) => p + ` L ${pt.x} ${pt.y}`);
          markHits(prev, pt);
          lastPtRef.current = pt;
        };

        const handlePointerUp = (e) => {
          if (!isDrawing) return;
          setIsDrawing(false);
          lastPtRef.current = null;
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch {}
        };

        const totalPts = checkpoints.length || 1;
        const percent = isDone ? 100 : Math.min(99, Math.round((covered.size / totalPts) * 100));

        return (
          <div className={`w-full bg-white rounded-2xl p-4 sm:p-5 flex flex-col items-center min-w-0 transition-all ${
            isDone ? 'border-[3px] border-[#10b981] bg-[#f0fdf4] shadow-[0_6px_0_#a7f3d0]' : 'border-[3px] border-dashed border-[#6ee7b7] shadow-xs'
          }`}>
            <div className="flex justify-between items-center w-full mb-2 gap-2 flex-wrap">
              <div className="flex items-center gap-2 min-w-0">
                <span className="font-['Outfit',sans-serif] font-[900] text-base sm:text-lg text-[#065f46] truncate">
                  {label}
                </span>
                <span className="text-xs sm:text-sm text-[#059669] font-[800] font-['Noto_Sans_Devanagari',sans-serif] truncate">
                  ({labelHi})
                </span>
              </div>

              <span className={`text-xs font-[900] px-3.5 py-1 rounded-full border transition-colors ${
                isDone
                  ? 'bg-[#dcfce7] text-[#065f46] border-[#34d399]'
                  : percent >= 80
                  ? 'bg-[#ecfdf5] text-[#059669] border-[#6ee7b7]'
                  : 'bg-[#fef9c3] text-[#854d0e] border-[#fde047]'
              }`}>
                {isDone ? '★ 100% 3D Filled!' : `${percent}% Traced (Poora trace karein)`}
              </span>
            </div>

            <div className="w-full bg-slate-100 h-2 rounded-full mb-3 overflow-hidden border border-slate-200">
              <div
                className={`h-full transition-all duration-150 rounded-full ${
                  isDone ? 'bg-[#10b981]' : percent >= 80 ? 'bg-[#34d399]' : 'bg-[#f59e0b]'
                }`}
                style={{ width: `${percent}%` }}
              />
            </div>

            <div
              style={{ height: isMultiLine ? '320px' : '200px', touchAction: 'none' }}
              className="relative w-full bg-white rounded-2xl border-2 border-[#cbd5e1] overflow-hidden select-none shadow-inner"
            >
              <svg
                ref={svgRef}
                viewBox={`0 0 ${widthNeeded} ${heightNeeded}`}
                preserveAspectRatio="xMidYMid meet"
                style={{ width: '100%', height: '100%', display: 'block', touchAction: 'none' }}
                className="cursor-crosshair select-none"
                onPointerDown={handlePointerDown}
                onPointerMove={handlePointerMove}
                onPointerUp={handlePointerUp}
                onPointerLeave={handlePointerUp}
                onPointerCancel={handlePointerUp}
              >
                <defs>
                  <linearGradient id={gradId} x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stopColor={theme.frontStart} />
                    <stop offset="100%" stopColor={theme.frontEnd} />
                  </linearGradient>
                </defs>

                <g style={{ pointerEvents: 'none' }}>
                  <line x1="10" y1={Y_TOP_1} x2={widthNeeded - 10} y2={Y_TOP_1} stroke="#fca5a5" strokeWidth="2" />
                  <line x1="10" y1={Y_MID_1} x2={widthNeeded - 10} y2={Y_MID_1} stroke="#93c5fd" strokeWidth="1.8" strokeDasharray="6 5" />
                  <line x1="10" y1={Y_BASE_1} x2={widthNeeded - 10} y2={Y_BASE_1} stroke="#60a5fa" strokeWidth="2.4" />
                  <line x1="10" y1={Y_BOT_1} x2={widthNeeded - 10} y2={Y_BOT_1} stroke="#fca5a5" strokeWidth="2" />
                </g>

                {isMultiLine && (
                  <g style={{ pointerEvents: 'none' }}>
                    <line x1="10" y1={Y_TOP_2} x2={widthNeeded - 10} y2={Y_TOP_2} stroke="#fca5a5" strokeWidth="2" />
                    <line x1="10" y1={Y_MID_2} x2={widthNeeded - 10} y2={Y_MID_2} stroke="#93c5fd" strokeWidth="1.8" strokeDasharray="6 5" />
                    <line x1="10" y1={Y_BASE_2} x2={widthNeeded - 10} y2={Y_BASE_2} stroke="#60a5fa" strokeWidth="2.4" />
                    <line x1="10" y1={Y_BOT_2} x2={widthNeeded - 10} y2={Y_BOT_2} stroke="#fca5a5" strokeWidth="2" />
                  </g>
                )}

                {!isDone && (
                  <g style={{ pointerEvents: 'none' }}>
                    <path d={patternPath} stroke="#f1f5f9" strokeWidth={strokeWidth + 2} strokeLinecap="round" strokeLinejoin="round" fill="none" />
                    <path d={patternPath} stroke="#94a3b8" strokeWidth={3} strokeLinecap="round" strokeDasharray="6 6" fill="none" />
                    {checkpoints.map((pt, i) => (
                      <circle key={i} cx={pt.x} cy={pt.y} r={covered.has(i) ? 5 : 3.5} fill={covered.has(i) ? '#10b981' : '#94a3b8'} />
                    ))}
                    <path d={userPath} stroke={theme.side3d} strokeWidth={strokeWidth + 4} strokeLinecap="round" strokeLinejoin="round" fill="none" opacity={0.35} />
                    <path d={userPath} stroke={`url(#${gradId})`} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" fill="none" />
                  </g>
                )}

                {isDone && (
                  <g style={{ pointerEvents: 'none' }}>
                    <path d={patternPath} transform="translate(5, 5)" stroke={theme.side3d} strokeWidth={strokeWidth + 2} strokeLinecap="round" strokeLinejoin="round" fill="none" />
                    <path d={patternPath} stroke={`url(#${gradId})`} strokeWidth={strokeWidth + 2} strokeLinecap="round" strokeLinejoin="round" fill="none" />
                    <path d={patternPath} transform="translate(-2, -2)" stroke="#ffffff" strokeWidth={strokeWidth * 0.3} strokeLinecap="round" strokeLinejoin="round" strokeOpacity={0.7} fill="none" />
                  </g>
                )}

                <rect x={0} y={0} width={widthNeeded} height={heightNeeded} fill="transparent" style={{ pointerEvents: isDone ? 'none' : 'all', cursor: 'crosshair' }} />
              </svg>
            </div>

            <div className="flex justify-between items-center w-full mt-3 gap-2 flex-wrap">
              <span className="text-xs sm:text-sm font-[800] text-[#475569]">
                {isDone ? (
                  <span className="text-[#059669] font-[900]">🎉 Poora letter 100% trace ho gaya! Shabaash!</span>
                ) : (
                  <span>✏️ Poora letter/ank trace karein — jab poora hoga tabhi complete hoga!</span>
                )}
              </span>

              <div className="flex items-center gap-2">
                {!isDone && (
                  <button
                    type="button"
                    onClick={() => {
                      const all = new Set();
                      checkpoints.forEach((_, i) => all.add(i));
                      setCovered(all);
                      triggerCompletion();
                    }}
                    className="text-xs font-[800] px-3 py-1.5 rounded-xl border border-[#34d399] bg-[#ecfdf5] hover:bg-[#d1fae5] text-[#059669] transition-colors"
                  >
                    ✨ Auto-Fill
                  </button>
                )}
                <button
                  type="button"
                  onClick={() => {
                    setInternalCompleted(false);
                    setCovered(new Set());
                    setUserPath('');
                    setIsDrawing(false);
                    lastPtRef.current = null;
                    playDotPopSound();
                    if (onReset) onReset();
                  }}
                  className="text-xs font-[800] px-3 py-1.5 rounded-xl border border-[#cbd5e1] bg-[#f8fafc] hover:bg-slate-100 text-[#334155] transition-colors"
                >
                  ↺ Clear
                </button>
              </div>
            </div>
          </div>
        );
      };

      /* ========================================================================
       * 11. PRACTICE STUDIO SECTION (2 Spacious Focused Boards)
       * ======================================================================== */
      const StudioSection = ({ currentNumber }) => {
        const [completedMap, setCompletedMap] = useState({});
        const ctx = getNumberContext(currentNumber);

        useEffect(() => {
          setCompletedMap({});
        }, [currentNumber]);

        const boards = [
          {
            id: 'board-num',
            pattern: 'number-single',
            label: `Board 1 · Numeral Trace (${currentNumber})`,
            labelHi: `अंक ${currentNumber} (${ctx.deva})`,
            speak: `Board 1! Trace Number ${currentNumber}!`,
            theme: COLOR_THEMES[0],
          },
          {

            label: `Board 2 · Full Spelling Trace (${ctx.wordEnUpper})`,
            labelHi: `पूरी स्पेलिंग: ${ctx.wordEnUpper} · ${ctx.wordHi}`,

            theme: COLOR_THEMES[1],
          },
        ];

        const completedCount = Object.values(completedMap).filter(Boolean).length;

        return (
          <section className="p-4 sm:p-7 mt-8 md:mt-11 bg-gradient-to-br from-[#ecfdf5] to-[#fffbeb] border-[3px] border-[#10b981] rounded-[26px] shadow-xs" id="overwrite-studio">
            <div className="flex justify-between items-center flex-wrap gap-3">
              <div>
                <p className="text-[11px] tracking-[1.4px] font-[800] text-[#059669] uppercase font-['Outfit',sans-serif]">
                  Maths Handwriting Board · अंक {currentNumber} और पूरी स्पेलिंग {ctx.wordEnUpper} के ऊपर हाथ फेरें
                </p>
                <h2 className="text-2xl sm:text-3xl font-[900] text-[#065f46] font-['Outfit',sans-serif] tracking-tight mt-0.5">
                  Spacious Overwriting Practice ({currentNumber} · {ctx.wordEnUpper})
                </h2>
              </div>

              <div className="flex gap-2.5 items-center flex-wrap">
                <span className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full border border-[#34d399] bg-white text-xs font-[800] text-[#059669]">
                  <span className="w-2 h-2 rounded-full bg-[#10b981]"></span>
                  <span>★ {completedCount} of {boards.length} Boards Filled</span>
                </span>

                <button
                  type="button"

                    boards.forEach((b) => (next[b.id] = true));
                    setCompletedMap(next);
                    playSuccessChime();
                    speakText(`All overwriting complete for Number ${currentNumber}! ${ctx.wordEn}!`, 'en-US');
                  }}
                  className="bg-[#10b981] hover:bg-[#059669] text-white px-4 py-2 rounded-xl font-[800] text-xs sm:text-sm shadow-[0_3px_0_#059669] transition-transform active:translate-y-0.5"
                >
                  ✨ Fill Both Boards
                </button>
                <button
                  type="button"
                  onClick={() => {
                    setCompletedMap({});
                    playDotPopSound();
                  }}
                  className="border-2 border-[#34d399] bg-white hover:bg-emerald-50 text-[#059669] px-3 py-1.5 rounded-xl font-[800] text-xs transition-colors"
                >
                  ↺ Reset
                </button>
              </div>
            </div>

            <p className="text-sm sm:text-base text-[#374151] mt-2.5 leading-relaxed">
              Full spelling is <strong>100% complete: {ctx.wordEnUpper} ({ctx.wordHi})</strong> with generous letter spacing!{' '}
              <span className="font-[800] text-[#059669] font-['Noto_Sans_Devanagari',sans-serif]">
                (माउस या उंगली से डॉट्स के ऊपर लाइन खींचें, जब तक पूरा trace न हो तब तक complete नहीं होगा!)
              </span>
            </p>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 mt-5">
              {boards.map((b) => (
                <OverwritingBox
                  key={`${currentNumber}_${b.id}`}
                  id={`${currentNumber}_${b.id}`}
                  pattern={b.pattern}
                  targetNumber={currentNumber}
                  label={b.label}
                  labelHi={b.labelHi}
                  theme={b.theme}
                  speakStr={b.speak}
                  isCompleted={Boolean(completedMap[b.id])}
                  onComplete={() => setCompletedMap((prev) => ({ ...prev, [b.id]: true }))}
                  onReset={() => setCompletedMap((prev) => ({ ...prev, [b.id]: false }))}
                />
              ))}
            </div>
          </section>
        );
      };

      /* ========================================================================
       * 12. REVIEW & MASTERY CERTIFICATE SECTION
       * ======================================================================== */
      const CheckAllBar = ({ currentNumber, completedTasks, onCheckAll, onResetAll }) => {
        const [showResults, setShowResults] = useState(false);
        const ctx = getNumberContext(currentNumber);

        useEffect(() => {
          setShowResults(false);
        }, [currentNumber]);

        const doneCount = Object.values(completedTasks).filter(Boolean).length;
        const percentage = Math.round((doneCount / 2) * 100);

        return (
          <>
            <section className="bg-[#fffbeb] border-[3px] border-[#fcd34d] rounded-[22px] p-4.5 sm:p-6 mt-7 flex justify-between items-center flex-wrap gap-4 shadow-xs">
              <div>
                <h2 className="text-xl sm:text-2xl font-[900] text-[#111827] font-['Outfit',sans-serif]">
                  Review &amp; Verify Mastery for Number {currentNumber} ({ctx.wordEnUpper})!
                </h2>
                <p className="text-sm text-[#4b5563] mt-0.5">
                  Review your child’s progress for Number {currentNumber} ({ctx.wordEn}) and full spelling {ctx.wordEnUpper}.

              <div className="flex gap-3 flex-wrap items-center">
                <button
                  type="button"
                  onClick={() => {
                    onCheckAll();
                    setShowResults(true);
                    playSuccessChime();
                    speakText(`Congratulations! You mastered Number ${currentNumber}! ${ctx.wordEn}!`, 'en-US');
                  }}
                  className="bg-[#10b981] hover:bg-[#059669] text-white px-5 py-3 rounded-2xl font-[800] text-sm sm:text-base shadow-[0_4px_0_#059669] transition-transform active:translate-y-0.5 font-['Outfit',sans-serif]"
                >
                  Verify all boards ✓
                </button>
                <button
                  type="button"
                  onClick={() => {
                    onResetAll();
                    setShowResults(false);
                    playDotPopSound();
                  }}
                  className="border-2 border-[#34d399] bg-white hover:bg-emerald-50 text-[#059669] px-4 py-2.5 rounded-2xl font-[800] text-sm transition-colors"
                >
                  ↺ Reset

              </div>
            </section>

            {showResults && (
              <section className="bg-white border-[3px] border-[#34d399] rounded-[22px] p-5 sm:p-6 mt-5 text-center shadow-[0_6px_0_#d1fae5] animate-in fade-in zoom-in-95 duration-300">
                <h2 className="text-2xl font-[900] text-[#065f46] font-['Outfit',sans-serif]">
                  🎉 Number {currentNumber} ({ctx.wordEnUpper}) Mastery Certificate
                </h2>
                <p className="text-lg font-[800] text-[#111827] mt-2 font-['Outfit',sans-serif]">
                  {doneCount} of 2 Overwriting Boards Completed ({percentage}%)!
                </p>
                <p className="text-base text-[#047857] mt-2 font-[700] font-['Noto_Sans_Devanagari',sans-serif]">
                  🌟 शाबाश! आपने अंक {currentNumber} और पूरी स्पेलिंग {ctx.wordEnUpper} ({ctx.wordHi}) को सही तरीके से लिखना और ठीक {currentNumber} वस्तुएं गिनना सीख लिया है!
                </p>
              </section>
            )}

            <nav className="flex justify-between items-center flex-wrap gap-3.5 py-6 sm:py-8">
              <a
                href="#exact-objects-lab"
                className="bg-[#10b981] hover:bg-[#059669] text-white px-5 py-2.5 rounded-xl font-[800] text-sm shadow-[0_3px_0_#059669] transition-transform active:translate-y-0.5 font-['Outfit',sans-serif]"
              >
                Count Exactly {currentNumber} Objects ↑
              </a>
              <a href="#main" className="text-sm font-[800] text-[#059669] hover:underline font-['Outfit',sans-serif]">
                Back to Top ↑
              </a>
            </nav>
          </>
        );
      };

      /* ========================================================================
       * 13. FOOTER
       * ======================================================================== */
      const EconovaFooter = () => (
        <footer className="w-full mt-12 py-8 px-[4%] md:px-[5.7%] border-t-2 border-[#a7f3d0] bg-white text-[#1f2937] font-['Quicksand',sans-serif]">
          <div className="w-full max-w-[1200px] mx-auto flex flex-col md:flex-row justify-between items-center gap-4 text-center md:text-left">
            <div>
              <div className="font-['Outfit',sans-serif] font-[900] text-lg text-[#065f46]">
                ECONOVA · Pre-School Maths Education
              </div>
              <p className="text-xs text-[#059669] font-[800] mt-1 font-['Noto_Sans_Devanagari',sans-serif]">
                अंक 1 से 100 तक की गिनती, स्पेलिंग और 3D ओवरराइटिंग अभ्यास
              </p>
            </div>
            <div className="text-xs text-[#64748b] font-[700]">
              © {new Date().getFullYear()} Econova Maths Lab. Kid-Safe &amp; Interactive.
            </div>
          </div>
        </footer>
      );

      /* ========================================================================
       * 14. ROOT APP COMPONENT & MOUNT
       * ======================================================================== */
      function App() {
        const [currentNumber, setCurrentNumber] = useState(1);
        const [selectedObject, setSelectedObject] = useState(SELECTABLE_OBJECTS[0]);
        const [completedTasks, setCompletedTasks] = useState({});

        const handleSelectNumber = (n) => {
          setCurrentNumber(n);
          setCompletedTasks({});
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        return (
          <div className="min-h-screen flex flex-col bg-[#f0fdf4] text-[#1f2937]">
            <EconovaHeader />
            <NumberSelectorBar currentNumber={currentNumber} onSelectNumber={handleSelectNumber} />
            <main id="main" className="flex-1 w-full max-w-[1200px] mx-auto px-3.5 sm:px-6 md:px-7">
              <HeroSection currentNumber={currentNumber} selectedObject={selectedObject} />
              <ExactObjectsLab
                currentNumber={currentNumber}
                selectedObject={selectedObject}
                onSelectObject={setSelectedObject}
              />
              <StudioSection currentNumber={currentNumber} />
              <CheckAllBar
                currentNumber={currentNumber}
                completedTasks={completedTasks}
                onCheckAll={() => setCompletedTasks({ 1: true, 2: true })}
                onResetAll={() => setCompletedTasks({})}
              />
            </main>
            <EconovaFooter />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
