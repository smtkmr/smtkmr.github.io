        // Render Cubes Visual Helper
        function renderCubes(containerId, count1, count2) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const group1 = document.createElement('div');
            group1.className = 'cube-group';
            for (let i = 1; i <= count1; i++) {
                const cube = document.createElement('div');
                cube.className = 'cube cube-blue';
                cube.innerText = i;
                group1.appendChild(cube);
            }

            const plus = document.createElement('span');
            plus.className = 'plus-sign';
            plus.innerText = '+';

            const group2 = document.createElement('div');
            group2.className = 'cube-group';
            for (let i = 1; i <= count2; i++) {
                const cube = document.createElement('div');
                cube.className = 'cube cube-red';
                cube.innerText = i;
                group2.appendChild(cube);
            }

            container.appendChild(group1);
            container.appendChild(plus);
            container.appendChild(group2);
        }

        // Card Selection Handler for Task 11
        function selectCard(element) {
            const cards = document.querySelectorAll('.option-card');
            cards.forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
            const radio = element.querySelector('input[type="radio"]');
            if(radio) radio.checked = true;
        }

        // Global Answer Verification
        function checkAllAnswers() {
            let totalCorrect = 0;
            let totalQuestions = 0;

            // 1. Check numeric inputs
            const inputs = document.querySelectorAll('.math-input');
            inputs.forEach(input => {
                totalQuestions++;
                const expected = input.getAttribute('data-answer');
                const val = input.value.trim();

                if (val === expected) {
                    input.classList.remove('incorrect');
                    input.classList.add('correct');
                    totalCorrect++;
                } else {
                    input.classList.remove('correct');
                    input.classList.add('incorrect');
                }
            });

            // 2. Check Task 11 (Group Selection)
            totalQuestions++;
            const task11Selected = document.querySelector('input[name="hot-group"]:checked');
            const task11Card = document.getElementById('task-11');
            if (task11Selected && task11Selected.getAttribute('data-correct') === 'true') {
                totalCorrect++;
                task11Card.style.borderColor = '#10b981';
            } else {
                task11Card.style.borderColor = '#ef4444';
            }

            // 3. Check Task 12 (Test Prep Radio)
            totalQuestions++;
            const task12Selected = document.querySelector('input[name="test-prep"]:checked');
            const task12Card = document.getElementById('task-12');
            if (task12Selected && task12Selected.getAttribute('data-correct') === 'true') {
                totalCorrect++;
                task12Card.style.borderColor = '#10b981';
            } else {
                task12Card.style.borderColor = '#ef4444';
            }

            // Alert Feedback
            setTimeout(() => {
                if (totalCorrect === totalQuestions) {
                    alert('🌟 Outstanding! You got all answers correct!');
                } else {
                    alert(`You got ${totalCorrect} out of ${totalQuestions} correct. Keep going! Check the red highlighted areas.`);
                }
            }, 100);
        }
    </script>
</body>
</html>
