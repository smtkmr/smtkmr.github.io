<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic 4: Use Pictures to Add To | Econova Kids</title>
  
  <!-- Google Fonts: Outfit & Quicksand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --font-main: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
      --font-heading: 'Outfit', 'Quicksand', sans-serif;
    }

    body {
      font-family: var(--font-main);
      background-color: #f0fdf4;
      color: #1f2937;
      min-height: 100vh;
    }

    h1, h2, h3, .brand-logo, .hero-title, .card-title {
      font-family: var(--font-heading);
    }

    header {
      background-color: #2dd4bf;
      border-bottom: 4px solid #10b981;
    }

    .brand-logo {
      color: #fde047;
      text-shadow: 2px 2px 0px #059669;
    }

    .mint-card {
      background-color: #ffffff;
      border: 3px solid #34d399;
      border-radius: 24px;
    }

    .amber-card {
      background-color: #fffbeb;
      border: 3px solid #fcd34d;
      border-radius: 24px;
    }

    .mint-btn {
      background-color: #10b981;
      color: #ffffff;
      font-weight: 800;
      border-radius: 16px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 0px #059669;
    }

    .mint-btn:hover {
      background-color: #059669;
      transform: translateY(-2px);
    }

    .mint-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0px 0px #059669;
    }

    .btn-red {
      background-color: #ff0000;
      color: #ffffff;
      border-radius: 50px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 0px #cc0000;
    }

    .btn-red:hover {
      background-color: #cc0000;
      transform: scale(1.05);
    }

    .opt-btn {
      background-color: #ffffff;
      border: 3px solid #34d399;
      color: #1f2937;
      font-weight: 800;
      font-size: 1.35rem;
      border-radius: 16px;
      padding: 14px 20px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 0px #a7f3d0;
      cursor: pointer;
    }

    .opt-btn:hover {
      background-color: #ecfdf5;
      border-color: #10b981;
      transform: translateY(-2px);
    }

    .opt-btn.selected {
      background-color: #fde047;
      border-color: #eab308;
      box-shadow: 0 4px 0px #ca8a04;
      color: #854d0e;
    }

    .correct-badge {
      background-color: #d1fae5;
      color: #047857;
      border: 2px solid #10b981;
    }

    .incorrect-badge {
      background-color: #fee2e2;
      color: #b91c1c;
      border: 2px solid #ef4444;
    }
  </style>
</head>
<body class="p-0 pb-12">

  <!-- Header -->
  <header class="p-4 sm:p-6 shadow-md flex justify-between items-center px-6 sm:px-12 sticky top-0 z-50">
    <a href="../index.html" class="brand-logo text-2xl sm:text-3xl font-extrabold tracking-wide no-underline">
      ✨ ECONOVA KIDS
    </a>
    <a href="../index.html" class="btn-red px-5 py-2 font-extrabold text-sm sm:text-base no-underline flex items-center gap-1">
      🏠 Home
    </a>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-8">
    
    <!-- Title Header -->
    <div class="text-center space-y-2">
      <span class="bg-emerald-100 text-emerald-800 font-extrabold text-sm px-4 py-1.5 rounded-full inline-block uppercase tracking-wider">
        Topic 4: Algebra
      </span>
      <h1 class="hero-title text-3xl sm:text-5xl font-black text-emerald-600">
        Use Pictures to Add To ➕
      </h1>
      <p class="text-gray-600 font-bold text-base sm:text-lg">
        Count the initial pictures, add more pictures to the group, and find the total sum!
      </p>
    </div>

    <!-- Progress Overview Bar -->
    <div class="amber-card p-4 sm:p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="font-bold text-xl text-amber-900">
        🌟 Overall Progress: <span id="completedCount" class="text-emerald-600 font-black">0</span> / 10 Completed
      </div>
      <button class="mint-btn px-6 py-2.5 text-base" onclick="resetAll()">
        🔄 Reset All Questions
      </button>
    </div>

    <!-- Tasks List Container -->
    <div id="tasksContainer" class="space-y-8">
      <!-- Generated dynamically by JS -->
    </div>

    <!-- Bottom Navigation Footer -->
    <div class="flex flex-col sm:flex-row justify-center items-center gap-4 pt-6 border-t-2 border-emerald-200">
      <a href="../index.html" class="btn-red text-center font-extrabold text-base py-3 px-8 no-underline w-full sm:w-auto flex items-center justify-center gap-2">
        ⬅ Back to Lessons
      </a>
      <a href="https://www.youtube.com" target="_blank" class="btn-red text-center font-extrabold text-base py-3 px-8 no-underline w-full sm:w-auto flex items-center justify-center gap-2">
        📺 Watch Video Solution
      </a>
    </div>

  </main>

  <script>
    const tasksData = [
      {
        id: 1,
        title: "Task 1: Ladybugs on a Leaf",
        part1Emojis: "🐞🐞🐞",
        part1Count: 3,
        part2Emojis: "🐞🐞",
        part2Count: 2,
        question: "Kitni ladybugs hain kul milakar (How many in total)?",
        options: ["3 + 2 = 5", "3 + 1 = 4", "2 + 2 = 4"],
        correctAnswer: "3 + 2 = 5",
        summaryText: "3 + 2 = 5 ladybugs"
      },
      {
        id: 2,
        title: "Task 2: Apples in a Basket",
        part1Emojis: "🍎🍎🍎🍎",
        part1Count: 4,
        part2Emojis: "🍎",
        part2Count: 1,
        question: "Kitne apples hain basket mein?",
        options: ["4 + 2 = 6", "4 + 1 = 5", "3 + 1 = 4"],
        correctAnswer: "4 + 1 = 5",
        summaryText: "4 + 1 = 5 apples"
      },
      {
        id: 3,
        title: "Task 3: Ducks in a Pond",
        part1Emojis: "🦆🦆",
        part1Count: 2,
        part2Emojis: "🦆🦆🦆",
        part2Count: 3,
        question: "Kitni ducks swim kar rahi hain?",
        options: ["2 + 2 = 4", "2 + 3 = 5", "3 + 3 = 6"],
        correctAnswer: "2 + 3 = 5",
        summaryText: "2 + 3 = 5 ducks"
      },
      {
        id: 4,
        title: "Task 4: Birds on a Branch",
        part1Emojis: "🐦🐦🐦🐦🐦",
        part1Count: 5,
        part2Emojis: "🐦🐦",
        part2Count: 2,
        question: "Branch par kul kitni birds hain?",
        options: ["5 + 2 = 7", "5 + 3 = 8", "4 + 2 = 6"],
        correctAnswer: "5 + 2 = 7",
        summaryText: "5 + 2 = 7 birds"
      },
      {
        id: 5,
        title: "Task 5: Balloons at a Party",
        part1Emojis: "🎈🎈🎈",
        part1Count: 3,
        part2Emojis: "🎈🎈🎈",
        part2Count: 3,
        question: "Aapke paas kul kitne balloons hain?",
        options: ["3 + 2 = 5", "3 + 4 = 7", "3 + 3 = 6"],
        correctAnswer: "3 + 3 = 6",
        summaryText: "3 + 3 = 6 balloons"
      },
      {
        id: 6,
        title: "Task 6: Cars in a Parking Lot",
        part1Emojis: "🚗🚗🚗🚗🚗🚗",
        part1Count: 6,
        part2Emojis: "🚗🚗",
        part2Count: 2,
        question: "Parking lot mein total kitni cars hain?",
        options: ["6 + 2 = 8", "6 + 1 = 7", "5 + 2 = 7"],
        correctAnswer: "6 + 2 = 8",
        summaryText: "6 + 2 = 8 cars"
      },
      {
        id: 7,
        title: "Task 7: Frogs on a Log",
        part1Emojis: "🐸",
        part1Count: 1,
        part2Emojis: "🐸🐸🐸🐸",
        part2Count: 4,
        question: "Log par kul kitne frogs hain?",
        options: ["1 + 3 = 4", "1 + 4 = 5", "2 + 4 = 6"],
        correctAnswer: "1 + 4 = 5",
        summaryText: "1 + 4 = 5 frogs"
      },
      {
        id: 8,
        title: "Task 8: Stars in the Sky",
        part1Emojis: "⭐️⭐️⭐️⭐️",
        part1Count: 4,
        part2Emojis: "⭐️⭐️⭐️⭐️",
        part2Count: 4,
        question: "Aasman mein kul kitne stars hain?",
        options: ["4 + 3 = 7", "4 + 5 = 9", "4 + 4 = 8"],
        correctAnswer: "4 + 4 = 8",
        summaryText: "4 + 4 = 8 stars"
      },
      {
        id: 9,
        title: "Task 9: Fish in the Bowl",
        part1Emojis: "🐟🐟🐟🐟🐟",
        part1Count: 5,
        part2Emojis: "🐟🐟🐟",
        part2Count: 3,
        question: "Fishbowl mein kul kitni fish hain?",
        options: ["5 + 3 = 8", "5 + 2 = 7", "4 + 3 = 7"],
        correctAnswer: "5 + 3 = 8",
        summaryText: "5 + 3 = 8 fish"
      },
      {
        id: 10,
        title: "Task 10: Flowers in the Garden",
        part1Emojis: "🌸🌸",
        part1Count: 2,
        part2Emojis: "🌸🌸🌸🌸🌸",
        part2Count: 5,
        question: "Garden mein total kitne flowers hain?",
        options: ["2 + 4 = 6", "2 + 5 = 7", "3 + 5 = 8"],
        correctAnswer: "2 + 5 = 7",
        summaryText: "2 + 5 = 7 flowers"
      }
    ];

    let userSelections = {};
    let taskStatus = {};

    function renderTasks() {
      const container = document.getElementById("tasksContainer");
      container.innerHTML = tasksData.map(task => `
        <div class="mint-card p-6 sm:p-8 shadow-md space-y-5" id="card-${task.id}">
          
          <!-- Card Header -->
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-emerald-100 pb-3">
            <h3 class="card-title text-2xl sm:text-3xl font-black text-emerald-600">
              ${task.title}
            </h3>
            <div id="badge-${task.id}" class="hidden text-sm font-bold px-3 py-1 rounded-full"></div>
          </div>

          <!-- Visual Addition Container (ENLARGED ICONS) -->
          <div class="bg-emerald-50 rounded-2xl p-5 sm:p-8 border-2 border-emerald-200 text-center space-y-4">
            <div class="flex flex-wrap items-center justify-center gap-4 sm:gap-6">
              
              <!-- First Group -->
              <div class="bg-white px-5 py-3 rounded-2xl border-2 border-emerald-300 shadow-sm flex items-center gap-3">
                <span class="text-4xl sm:text-6xl tracking-widest">${task.part1Emojis}</span>
                <span class="text-base sm:text-lg font-black bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full">
                  ${task.part1Count}
                </span>
              </div>

              <!-- Plus Sign -->
              <span class="text-emerald-600 font-black text-4xl sm:text-5xl">+</span>

              <!-- Second Group -->
              <div class="bg-white px-5 py-3 rounded-2xl border-2 border-emerald-300 shadow-sm flex items-center gap-3">
                <span class="text-4xl sm:text-6xl tracking-widest">${task.part2Emojis}</span>
                <span class="text-base sm:text-lg font-black bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full">
                  ${task.part2Count}
                </span>
              </div>

            </div>

            <!-- Question Text -->
            <p class="text-gray-800 font-extrabold text-lg sm:text-2xl pt-2">
              ❓ ${task.question}
            </p>
          </div>

          <!-- Options Grid -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            ${task.options.map(opt => `
              <button 
                class="opt-btn ${userSelections[task.id] === opt ? 'selected' : ''}" 
                onclick="selectOption(${task.id}, '${opt}')"
              >
                ${opt}
              </button>
            `).join('')}
          </div>

          <!-- Actions & Result -->
          <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-2">
            <button class="mint-btn px-8 py-3 text-lg w-full sm:w-auto" onclick="checkTask(${task.id})">
              Check Answer
            </button>
            <div id="result-${task.id}" class="text-xl font-black min-h-[32px] text-center sm:text-right"></div>
          </div>

        </div>
      `).join('');

      updateProgress();
    }

    function selectOption(taskId, option) {
      userSelections[taskId] = option;
      renderTasks();
    }

    function checkTask(taskId) {
      const task = tasksData.find(t => t.id === taskId);
      const selected = userSelections[taskId];
      const resultDiv = document.getElementById(`result-${taskId}`);
      const badgeDiv = document.getElementById(`badge-${taskId}`);

      if (!selected) {
        resultDiv.innerText = "Please select an answer first!";
        resultDiv.className = "text-amber-600 font-bold text-lg";
        return;
      }

      if (selected === task.correctAnswer) {
        resultDiv.innerText = `🎉 Correct! Answer: ${task.summaryText}`;
        resultDiv.className = "text-emerald-600 font-black text-xl";
        
        badgeDiv.innerText = "✓ Correct";
        badgeDiv.className = "correct-badge text-sm font-bold px-3 py-1 rounded-full block";
        taskStatus[taskId] = true;
      } else {
        resultDiv.innerText = "❌ Incorrect! Try again.";
        resultDiv.className = "text-red-600 font-black text-xl";
        
        badgeDiv.innerText = "✕ Try Again";
        badgeDiv.className = "incorrect-badge text-sm font-bold px-3 py-1 rounded-full block";
        taskStatus[taskId] = false;
      }

      updateProgress();
    }

    function updateProgress() {
      const completed = Object.values(taskStatus).filter(Boolean).length;
      document.getElementById("completedCount").innerText = completed;
    }

    function resetAll() {
      userSelections = {};
      taskStatus = {};
      renderTasks();
    }

    // Initial Render
    renderTasks();
  </script>
</body>
</html>
