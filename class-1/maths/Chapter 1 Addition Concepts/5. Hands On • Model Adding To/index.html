<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic: Animals Adding To | Econova Kids</title>
  
  <!-- Google Fonts: Outfit & Quicksand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --font-main: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
      --font-heading: 'Outfit', 'Quicksand', sans-serif;
    }

    body {
      font-family: var(--font-main);
      background-color: #f0fdf4;
      color: #1f2937;
      min-height: 100vh;
    }

    h1, h2, h3, .brand-logo, .hero-title, .card-title {
      font-family: var(--font-heading);
    }

    header {
      background-color: #2dd4bf;
      border-bottom: 4px solid #10b981;
    }

    .brand-logo {
      color: #fde047;
      text-shadow: 2px 2px 0px #059669;
    }

    .mint-card {
      background-color: #ffffff;
      border: 3px solid #34d399;
      border-radius: 24px;
    }

    .amber-card {
      background-color: #fffbeb;
      border: 3px solid #fcd34d;
      border-radius: 24px;
    }

    /* BUTTON STYLES STRICTLY FOLLOWING DESIGN SYSTEM */
    .mint-btn {
      background-color: #0dbe7a;
      color: #ffffff;
      font-weight: 800;
      border-radius: 16px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(13, 190, 122, 0.3);
    }

    .mint-btn:hover {
      background-color: #059669;
      transform: translateY(-2px);
    }

    .mint-btn:active {
      transform: translateY(1px);
    }

    .btn-red {
      background-color: #ff0000;
      color: #ffffff;
      border-radius: 9999px;
      font-weight: 800;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(255, 0, 0, 0.25);
    }

    .btn-red:hover {
      background-color: #cc0000;
      transform: translateY(-2px);
    }

    .btn-blue {
      background-color: #0085d1;
      color: #ffffff;
      border-radius: 16px;
      font-weight: 800;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 133, 209, 0.25);
    }

    .btn-blue:hover {
      background-color: #0369a1;
      transform: translateY(-2px);
    }

    .opt-btn {
      background-color: #ffffff;
      border: 3px solid #34d399;
      color: #1f2937;
      font-weight: 800;
      font-size: 1.35rem;
      border-radius: 16px;
      padding: 14px 20px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 0px #a7f3d0;
      cursor: pointer;
    }

    .opt-btn:hover {
      background-color: #ecfdf5;
      border-color: #10b981;
      transform: translateY(-2px);
    }

    .opt-btn.selected {
      background-color: #fde047;
      border-color: #eab308;
      box-shadow: 0 4px 0px #ca8a04;
      color: #854d0e;
    }

    .correct-badge {
      background-color: #d1fae5;
      color: #047857;
      border: 2px solid #10b981;
    }

    .incorrect-badge {
      background-color: #fee2e2;
      color: #b91c1c;
      border: 2px solid #ef4444;
    }
  </style>
</head>
<body class="p-0 pb-12">

  <!-- Header -->
  <header class="p-4 sm:p-6 shadow-md flex justify-between items-center px-6 sm:px-12 sticky top-0 z-50">
    <a href="../index.html" class="brand-logo text-2xl sm:text-3xl font-extrabold tracking-wide no-underline">
      ✨ ECONOVA KIDS
    </a>
    <a href="../index.html" class="btn-red px-6 py-2.5 text-sm sm:text-base no-underline flex items-center gap-1">
      ← Back to Lessons
    </a>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-8">
    
    <!-- Title Header -->
    <div class="text-center space-y-2">
      <span class="bg-emerald-100 text-emerald-800 font-extrabold text-sm px-4 py-1.5 rounded-full inline-block uppercase tracking-wider">
        Topic: Visual Addition
      </span>
      <h1 class="hero-title text-3xl sm:text-5xl font-black text-emerald-600">
        Animals Adding To 🐾
      </h1>
      <p class="text-gray-600 font-bold text-base sm:text-lg">
        Look at the animal groups, follow the story sentence, and choose the correct total!
      </p>
    </div>

    <!-- Progress Overview Bar -->
    <div class="amber-card p-4 sm:p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="font-bold text-xl text-amber-900">
        🌟 Overall Progress: <span id="completedCount" class="text-emerald-600 font-black">0</span> / 10 Completed
      </div>
      <button class="mint-btn px-6 py-2.5 text-base" onclick="resetAll()">
        🔄 Reset All Questions
      </button>
    </div>

    <!-- Tasks List Container -->
    <div id="tasksContainer" class="space-y-8">
      <!-- Generated dynamically by JS -->
    </div>

    <!-- Bottom Navigation Footer Matching Strict Format -->
    <div class="pt-8 border-t-2 border-emerald-200">
      <div class="flex flex-col sm:flex-row justify-center items-center gap-4">
        <a href="../index.html" class="btn-red text-center font-extrabold text-lg py-3.5 px-8 no-underline w-full sm:w-auto flex items-center justify-center gap-2">
          ← Back to Lessons
        </a>
        <a href="https://www.youtube.com" target="_blank" class="btn-blue text-center font-extrabold text-lg py-3.5 px-8 no-underline w-full sm:w-auto flex items-center justify-center gap-2">
          📺 Watch Video Solution
        </a>
      </div>
    </div>

  </main>

  <script>
    const tasksData = [
      {
        id: 1,
        title: "Task 1: Cats Playing 🐱",
        pictureText: "2 cats sitting and 1 more cat walking over.",
        part1Emojis: "🐱🐱",
        part1Count: 2,
        part2Emojis: "🐱",
        part2Count: 1,
        sentence: "2 cats and 1 more cat → ___ cats in all.",
        options: ["3 cats in all", "2 cats in all", "4 cats in all"],
        correctAnswer: "3 cats in all",
        summaryText: "2 cats and 1 more cat → 3 cats in all."
      },
      {
        id: 2,
        title: "Task 2: Swimming Fish 🐟",
        pictureText: "3 colorful fish swimming and 1 more fish joining them.",
        part1Emojis: "🐟🐟🐟",
        part1Count: 3,
        part2Emojis: "🐟",
        part2Count: 1,
        sentence: "3 fish and 1 more fish → ___ fish in all.",
        options: ["5 fish in all", "4 fish in all", "3 fish in all"],
        correctAnswer: "4 fish in all",
        summaryText: "3 fish and 1 more fish → 4 fish in all."
      },
      {
        id: 3,
        title: "Task 3: Buzzing Bees 🐝",
        pictureText: "4 bees on the left and 4 more bees flying over.",
        part1Emojis: "🐝🐝🐝🐝",
        part1Count: 4,
        part2Emojis: "🐝🐝🐝🐝",
        part2Count: 4,
        sentence: "4 bees and 4 more bees → ___ bees in all.",
        options: ["6 bees in all", "7 bees in all", "8 bees in all"],
        correctAnswer: "8 bees in all",
        summaryText: "4 bees and 4 more bees → 8 bees in all."
      },
      {
        id: 4,
        title: "Task 4: Hopping Frogs 🐸",
        pictureText: "2 green frogs on a log and 2 more frogs hopping in.",
        part1Emojis: "🐸🐸",
        part1Count: 2,
        part2Emojis: "🐸🐸",
        part2Count: 2,
        sentence: "2 frogs and 2 more frogs → ___ frogs in all.",
        options: ["4 frogs in all", "3 frogs in all", "5 frogs in all"],
        correctAnswer: "4 frogs in all",
        summaryText: "2 frogs and 2 more frogs → 4 frogs in all."
      },
      {
        id: 5,
        title: "Task 5: Flying Birds 🐦",
        pictureText: "5 birds sitting on a branch and 1 more bird landing.",
        part1Emojis: "🐦🐦🐦🐦🐦",
        part1Count: 5,
        part2Emojis: "🐦",
        part2Count: 1,
        sentence: "5 birds and 1 more bird → ___ birds in all.",
        options: ["5 birds in all", "6 birds in all", "7 birds in all"],
        correctAnswer: "6 birds in all",
        summaryText: "5 birds and 1 more bird → 6 birds in all."
      },
      {
        id: 6,
        title: "Task 6: Cute Puppies 🐶",
        pictureText: "3 puppies playing with a ball and 3 more puppies running over.",
        part1Emojis: "🐶🐶🐶",
        part1Count: 3,
        part2Emojis: "🐶🐶🐶",
        part2Count: 3,
        sentence: "3 puppies and 3 more puppies → ___ puppies in all.",
        options: ["5 puppies in all", "6 puppies in all", "7 puppies in all"],
        correctAnswer: "6 puppies in all",
        summaryText: "3 puppies and 3 more puppies → 6 puppies in all."
      },
      {
        id: 7,
        title: "Task 7: Fluttering Butterflies 🦋",
        pictureText: "1 butterfly on a flower and 4 more butterflies flying nearby.",
        part1Emojis: "🦋",
        part1Count: 1,
        part2Emojis: "🦋🦋🦋🦋",
        part2Count: 4,
        sentence: "1 butterfly and 4 more butterflies → ___ butterflies in all.",
        options: ["4 butterflies in all", "5 butterflies in all", "6 butterflies in all"],
        correctAnswer: "5 butterflies in all",
        summaryText: "1 butterfly and 4 more butterflies → 5 butterflies in all."
      },
      {
        id: 8,
        title: "Task 8: Little Ducks 🦆",
        pictureText: "4 ducks in the pond and 2 more ducks joining the swim.",
        part1Emojis: "🦆🦆🦆🦆",
        part1Count: 4,
        part2Emojis: "🦆🦆",
        part2Count: 2,
        sentence: "4 ducks and 2 more ducks → ___ ducks in all.",
        options: ["6 ducks in all", "5 ducks in all", "7 ducks in all"],
        correctAnswer: "6 ducks in all",
        summaryText: "4 ducks and 2 more ducks → 6 ducks in all."
      },
      {
        id: 9,
        title: "Task 9: Crawling Ants 🐜",
        pictureText: "6 ants carrying leaves and 3 more ants behind them.",
        part1Emojis: "🐜🐜🐜🐜🐜🐜",
        part1Count: 6,
        part2Emojis: "🐜🐜🐜",
        part2Count: 3,
        sentence: "6 ants and 3 more ants → ___ ants in all.",
        options: ["8 ants in all", "9 ants in all", "10 ants in all"],
        correctAnswer: "9 ants in all",
        summaryText: "6 ants and 3 more ants → 9 ants in all."
      },
      {
        id: 10,
        title: "Task 10: Ladybugs on Leaves 🐞",
        pictureText: "5 ladybugs resting on a leaf and 2 more ladybugs crawling up.",
        part1Emojis: "🐞🐞🐞🐞🐞",
        part1Count: 5,
        part2Emojis: "🐞🐞",
        part2Count: 2,
        sentence: "5 ladybugs and 2 more ladybugs → ___ ladybugs in all.",
        options: ["6 ladybugs in all", "7 ladybugs in all", "8 ladybugs in all"],
        correctAnswer: "7 ladybugs in all",
        summaryText: "5 ladybugs and 2 more ladybugs → 7 ladybugs in all."
      }
    ];

    let userSelections = {};
    let taskStatus = {};

    function renderTasks() {
      const container = document.getElementById("tasksContainer");
      container.innerHTML = tasksData.map(task => `
        <div class="mint-card p-6 sm:p-8 shadow-md space-y-5" id="card-${task.id}">
          
          <!-- Card Header -->
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-emerald-100 pb-3">
            <h3 class="card-title text-2xl sm:text-3xl font-black text-emerald-600">
              ${task.title}
            </h3>
            <div id="badge-${task.id}" class="hidden text-sm font-bold px-3 py-1 rounded-full"></div>
          </div>

          <!-- Visual Animal Display Box -->
          <div class="bg-emerald-50 rounded-2xl p-5 sm:p-8 border-2 border-emerald-200 text-center space-y-4">
            
            <p class="text-gray-600 font-bold text-base sm:text-lg italic">
              🖼️ Picture: "${task.pictureText}"
            </p>

            <div class="flex flex-wrap items-center justify-center gap-4 sm:gap-6 py-2">
              
              <!-- First Group -->
              <div class="bg-white px-5 py-3 rounded-2xl border-2 border-emerald-300 shadow-sm flex items-center gap-3">
                <span class="text-4xl sm:text-6xl tracking-widest">${task.part1Emojis}</span>
                <span class="text-base sm:text-lg font-black bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full">
                  ${task.part1Count}
                </span>
              </div>

              <!-- Plus Sign -->
              <span class="text-emerald-600 font-black text-4xl sm:text-5xl">+</span>

              <!-- Second Group -->
              <div class="bg-white px-5 py-3 rounded-2xl border-2 border-emerald-300 shadow-sm flex items-center gap-3">
                <span class="text-4xl sm:text-6xl tracking-widest">${task.part2Emojis}</span>
                <span class="text-base sm:text-lg font-black bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full">
                  ${task.part2Count}
                </span>
              </div>

            </div>

            <!-- Sentence Task Prompt -->
            <div class="bg-white p-4 rounded-xl border border-emerald-300 inline-block">
              <p class="text-emerald-900 font-black text-lg sm:text-2xl">
                📝 Sentence: ${task.sentence}
              </p>
            </div>
          </div>

          <!-- Options Grid -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            ${task.options.map(opt => `
              <button 
                class="opt-btn ${userSelections[task.id] === opt ? 'selected' : ''}" 
                onclick="selectOption(${task.id}, '${opt}')"
              >
                ${opt}
              </button>
            `).join('')}
          </div>

          <!-- Actions & Result -->
          <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-2">
            <button class="mint-btn px-8 py-3.5 text-lg w-full sm:w-auto flex items-center justify-center gap-2" onclick="checkTask(${task.id})">
              Check Answers 🎯
            </button>
            <div id="result-${task.id}" class="text-xl font-black min-h-[32px] text-center sm:text-right"></div>
          </div>

        </div>
      `).join('');

      updateProgress();
    }

    function selectOption(taskId, option) {
      userSelections[taskId] = option;
      renderTasks();
    }

    function checkTask(taskId) {
      const task = tasksData.find(t => t.id === taskId);
      const selected = userSelections[taskId];
      const resultDiv = document.getElementById(`result-${taskId}`);
      const badgeDiv = document.getElementById(`badge-${taskId}`);

      if (!selected) {
        resultDiv.innerText = "Please select an answer first!";
        resultDiv.className = "text-amber-600 font-bold text-lg";
        return;
      }

      if (selected === task.correctAnswer) {
        resultDiv.innerText = `🎉 Correct! ${task.summaryText}`;
        resultDiv.className = "text-emerald-600 font-black text-xl";
        
        badgeDiv.innerText = "✓ Correct";
        badgeDiv.className = "correct-badge text-sm font-bold px-3 py-1 rounded-full block";
        taskStatus[taskId] = true;
      } else {
        resultDiv.innerText = "❌ Incorrect! Try again.";
        resultDiv.className = "text-red-600 font-black text-xl";
        
        badgeDiv.innerText = "✕ Try Again";
        badgeDiv.className = "incorrect-badge text-sm font-bold px-3 py-1 rounded-full block";
        taskStatus[taskId] = false;
      }

      updateProgress();
    }

    function updateProgress() {
      const completed = Object.values(taskStatus).filter(Boolean).length;
      document.getElementById("completedCount").innerText = completed;
    }

    function resetAll() {
      userSelections = {};
      taskStatus = {};
      renderTasks();
    }

    // Initial Render
    renderTasks();
  </script>
</body>
</html>
