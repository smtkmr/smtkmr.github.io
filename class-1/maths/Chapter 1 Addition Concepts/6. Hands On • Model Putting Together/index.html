<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic: Animal Addition & H.O.T. Challenges | Econova Kids</title>
  
  <!-- Google Fonts: Outfit & Quicksand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --font-main: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
      --font-heading: 'Outfit', 'Quicksand', sans-serif;
    }

    body {
      font-family: var(--font-main);
      background-color: #f0fdf4;
      color: #1f2937;
      min-height: 100vh;
    }

    h1, h2, h3, .brand-logo, .hero-title, .card-title {
      font-family: var(--font-heading);
    }

    header {
      background-color: #2dd4bf;
      border-bottom: 4px solid #10b981;
    }

    .brand-logo {
      color: #fde047;
      text-shadow: 2px 2px 0px #059669;
    }

    .mint-card {
      background-color: #ffffff;
      border: 3px solid #34d399;
      border-radius: 24px;
    }

    .amber-card {
      background-color: #fffbeb;
      border: 3px solid #fcd34d;
      border-radius: 24px;
    }

    /* BUTTON STYLES STRICTLY FOLLOWING DESIGN SYSTEM */
    .mint-btn {
      background-color: #0dbe7a;
      color: #ffffff;
      font-weight: 800;
      border-radius: 16px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(13, 190, 122, 0.3);
    }

    .mint-btn:hover {
      background-color: #059669;
      transform: translateY(-2px);
    }

    .mint-btn:active {
      transform: translateY(1px);
    }

    .btn-red {
      background-color: #ff0000;
      color: #ffffff;
      border-radius: 9999px;
      font-weight: 800;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(255, 0, 0, 0.25);
    }

    .btn-red:hover {
      background-color: #cc0000;
      transform: translateY(-2px);
    }

    .btn-blue {
      background-color: #0085d1;
      color: #ffffff;
      border-radius: 16px;
      font-weight: 800;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 133, 209, 0.25);
    }

    .btn-blue:hover {
      background-color: #0369a1;
      transform: translateY(-2px);
    }

    .opt-btn {
      background-color: #ffffff;
      border: 3px solid #34d399;
      color: #1f2937;
      font-weight: 800;
      font-size: 1.2rem;
      border-radius: 16px;
      padding: 12px 18px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 0px #a7f3d0;
      cursor: pointer;
    }

    .opt-btn:hover {
      background-color: #ecfdf5;
      border-color: #10b981;
      transform: translateY(-2px);
    }

    .opt-btn.selected {
      background-color: #fde047;
      border-color: #eab308;
      box-shadow: 0 4px 0px #ca8a04;
      color: #854d0e;
    }

    .correct-badge {
      background-color: #d1fae5;
      color: #047857;
      border: 2px solid #10b981;
    }

    .incorrect-badge {
      background-color: #fee2e2;
      color: #b91c1c;
      border: 2px solid #ef4444;
    }
  </style>
</head>
<body class="p-0 pb-12">

  <!-- Header -->
  <header class="p-4 sm:p-6 shadow-md flex justify-between items-center px-6 sm:px-12 sticky top-0 z-50">
    <a href="../index.html" class="brand-logo text-2xl sm:text-3xl font-extrabold tracking-wide no-underline">
      ✨ ECONOVA KIDS
    </a>
    <a href="../index.html" class="btn-red px-6 py-2.5 text-sm sm:text-base no-underline flex items-center gap-1">
      ← Back to Lessons
    </a>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-8">
    
    <!-- Title Header -->
    <div class="text-center space-y-2">
      <span class="bg-emerald-100 text-emerald-800 font-extrabold text-sm px-4 py-1.5 rounded-full inline-block uppercase tracking-wider">
        Topic: Addition Practice & H.O.T. Challenges
      </span>
      <h1 class="hero-title text-3xl sm:text-5xl font-black text-emerald-600">
        Addition & Brain Challenges 🦋
      </h1>
      <p class="text-gray-600 font-bold text-base sm:text-lg">
        Solve the visual addition tasks and complete the H.O.T. drawing challenges!
      </p>
    </div>

    <!-- Progress Overview Bar -->
    <div class="amber-card p-4 sm:p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="font-bold text-xl text-amber-900">
        🌟 Overall Progress: <span id="completedCount" class="text-emerald-600 font-black">0</span> / 10 Completed
      </div>
      <button class="mint-btn px-6 py-2.5 text-base" onclick="resetAll()">
        🔄 Reset All Tasks
      </button>
    </div>

    <!-- Tasks List Container -->
    <div id="tasksContainer" class="space-y-8">
      <!-- Generated dynamically by JS -->
    </div>

    <!-- Bottom Navigation Footer Matching Strict Format -->
    <div class="pt-8 border-t-2 border-emerald-200">
      <div class="flex flex-col sm:flex-row justify-center items-center gap-4">
        <a href="../index.html" class="btn-red text-center font-extrabold text-lg py-3.5 px-8 no-underline w-full sm:w-auto flex items-center justify-center gap-2">
          ← Back to Lessons
        </a>
        <a href="https://www.youtube.com" target="_blank" class="btn-blue text-center font-extrabold text-lg py-3.5 px-8 no-underline w-full sm:w-auto flex items-center justify-center gap-2">
          📺 Watch Video Solution
        </a>
      </div>
    </div>

  </main>

  <script>
    const tasksData = [
      {
        id: 1,
        title: "Task 1: Flying Butterflies 🦋",
        isHot: false,
        pictureText: "2 butterflies resting on a leaf and 4 more butterflies flying over.",
        part1Emojis: "🦋🦋",
        part1Count: 2,
        part2Emojis: "🦋🦋🦋🦋",
        part2Count: 4,
        sentence: "2 butterflies and 4 more butterflies → ___ butterflies in all.",
        options: ["6 butterflies", "5 butterflies", "7 butterflies"],
        correctAnswer: "6 butterflies",
        summaryText: "2 + 4 = 6 butterflies in all!"
      },
      {
        id: 2,
        title: "Task 2: Crawling Ladybugs 🐞",
        isHot: false,
        pictureText: "4 ladybugs sitting together and 3 more ladybugs crawling toward them.",
        part1Emojis: "🐞🐞🐞🐞",
        part1Count: 4,
        part2Emojis: "🐞🐞🐞",
        part2Count: 3,
        sentence: "4 ladybugs and 3 more ladybugs → ___ ladybugs in all.",
        options: ["6 ladybugs", "7 ladybugs", "8 ladybugs"],
        correctAnswer: "7 ladybugs",
        summaryText: "4 + 3 = 7 ladybugs in all!"
      },
      {
        id: 3,
        title: "Task 3: H.O.T. Worm Challenge 🪱",
        isHot: true,
        targetSum: 9,
        pictureText: "Draw two groups of worms that add up to 9 worms in total.",
        sentence: "___ worms and ___ more worms → 9 worms.",
        options: [
          "5 worms and 4 more worms",
          "6 worms and 2 more worms",
          "3 worms and 5 more worms"
        ],
        correctAnswer: "5 worms and 4 more worms",
        summaryText: "5 worms + 4 worms = 9 worms!"
      },
      {
        id: 4,
        title: "Task 4: Garden Snails 🐌",
        isHot: false,
        pictureText: "3 snails on the grass and 3 more snails creeping closer.",
        part1Emojis: "🐌🐌🐌",
        part1Count: 3,
        part2Emojis: "🐌🐌🐌",
        part2Count: 3,
        sentence: "3 snails and 3 more snails → ___ snails in all.",
        options: ["5 snails", "6 snails", "7 snails"],
        correctAnswer: "6 snails",
        summaryText: "3 + 3 = 6 snails in all!"
      },
      {
        id: 5,
        title: "Task 5: Swimming Fish 🐟",
        isHot: false,
        pictureText: "5 little fish in the pond and 2 more fish joining the group.",
        part1Emojis: "🐟🐟🐟🐟🐟",
        part1Count: 5,
        part2Emojis: "🐟🐟",
        part2Count: 2,
        sentence: "5 fish and 2 more fish → ___ fish in all.",
        options: ["7 fish", "6 fish", "8 fish"],
        correctAnswer: "7 fish",
        summaryText: "5 + 2 = 7 fish in all!"
      },
      {
        id: 6,
        title: "Task 6: Hopping Grasshoppers 🦗",
        isHot: false,
        pictureText: "1 grasshopper on a stone and 5 more grasshoppers hopping over.",
        part1Emojis: "🦗",
        part1Count: 1,
        part2Emojis: "🦗🦗🦗🦗🦗",
        part2Count: 5,
        sentence: "1 grasshopper and 5 more grasshoppers → ___ grasshoppers in all.",
        options: ["5 grasshoppers", "6 grasshoppers", "7 grasshoppers"],
        correctAnswer: "6 grasshoppers",
        summaryText: "1 + 5 = 6 grasshoppers in all!"
      },
      {
        id: 7,
        title: "Task 7: H.O.T. Star Challenge ⭐",
        isHot: true,
        targetSum: 8,
        pictureText: "Draw two groups of stars that add up to 8 stars in total.",
        sentence: "___ stars and ___ more stars → 8 stars.",
        options: [
          "4 stars and 4 more stars",
          "5 stars and 2 more stars",
          "3 stars and 4 more stars"
        ],
        correctAnswer: "4 stars and 4 more stars",
        summaryText: "4 stars + 4 stars = 8 stars!"
      },
      {
        id: 8,
        title: "Task 8: Busy Ants 🐜",
        isHot: false,
        pictureText: "6 ants carrying food and 2 more ants following behind.",
        part1Emojis: "🐜🐜🐜🐜🐜🐜",
        part1Count: 6,
        part2Emojis: "🐜🐜",
        part2Count: 2,
        sentence: "6 ants and 2 more ants → ___ ants in all.",
        options: ["7 ants", "8 ants", "9 ants"],
        correctAnswer: "8 ants",
        summaryText: "6 + 2 = 8 ants in all!"
      },
      {
        id: 9,
        title: "Task 9: Cute Caterpillars 🐛",
        isHot: false,
        pictureText: "3 caterpillars on a branch and 5 more caterpillars joining them.",
        part1Emojis: "🐛🐛🐛",
        part1Count: 3,
        part2Emojis: "🐛🐛🐛🐛🐛",
        part2Count: 5,
        sentence: "3 caterpillars and 5 more caterpillars → ___ caterpillars in all.",
        options: ["7 caterpillars", "8 caterpillars", "9 caterpillars"],
        correctAnswer: "8 caterpillars",
        summaryText: "3 + 5 = 8 caterpillars in all!"
      },
      {
        id: 10,
        title: "Task 10: H.O.T. Apple Challenge 🍎",
        isHot: true,
        targetSum: 10,
        pictureText: "Draw two groups of apples that add up to 10 apples in total.",
        sentence: "___ apples and ___ more apples → 10 apples.",
        options: [
          "5 apples and 5 more apples",
          "6 apples and 3 more apples",
          "4 apples and 5 more apples"
        ],
        correctAnswer: "5 apples and 5 more apples",
        summaryText: "5 apples + 5 apples = 10 apples!"
      }
    ];

    let userSelections = {};
    let taskStatus = {};

    function renderTasks() {
      const container = document.getElementById("tasksContainer");
      container.innerHTML = tasksData.map(task => {
        const cardClass = task.isHot ? 'amber-card' : 'mint-card';
        const badgeTag = task.isHot 
          ? '<span class="bg-amber-200 text-amber-900 text-xs font-black px-3 py-1 rounded-full uppercase">🔥 H.O.T. Challenge</span>'
          : '';

        return `
        <div class="${cardClass} p-6 sm:p-8 shadow-md space-y-5" id="card-${task.id}">
          
          <!-- Card Header -->
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-emerald-100 pb-3">
            <div class="flex items-center gap-2">
              <h3 class="card-title text-2xl sm:text-3xl font-black text-emerald-600">
                ${task.title}
              </h3>
              ${badgeTag}
            </div>
            <div id="badge-${task.id}" class="hidden text-sm font-bold px-3 py-1 rounded-full"></div>
          </div>

          <!-- Display Box -->
          <div class="${task.isHot ? 'bg-amber-100/50 border-amber-300' : 'bg-emerald-50 border-emerald-200'} rounded-2xl p-5 sm:p-8 border-2 text-center space-y-4">
            
            <p class="text-gray-700 font-bold text-base sm:text-lg italic">
              📌 ${task.pictureText}
            </p>

            ${!task.isHot ? `
              <div class="flex flex-wrap items-center justify-center gap-4 sm:gap-6 py-2">
                <div class="bg-white px-5 py-3 rounded-2xl border-2 border-emerald-300 shadow-sm flex items-center gap-3">
                  <span class="text-3xl sm:text-5xl tracking-widest">${task.part1Emojis}</span>
                  <span class="text-base sm:text-lg font-black bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full">
                    ${task.part1Count}
                  </span>
                </div>
                <span class="text-emerald-600 font-black text-3xl sm:text-4xl">+</span>
                <div class="bg-white px-5 py-3 rounded-2xl border-2 border-emerald-300 shadow-sm flex items-center gap-3">
                  <span class="text-3xl sm:text-5xl tracking-widest">${task.part2Emojis}</span>
                  <span class="text-base sm:text-lg font-black bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full">
                    ${task.part2Count}
                  </span>
                </div>
              </div>
            ` : ''}

            <!-- Sentence Task Prompt -->
            <div class="bg-white p-4 rounded-xl border border-emerald-300 inline-block shadow-sm">
              <p class="text-emerald-900 font-black text-lg sm:text-xl">
                📝 ${task.sentence}
              </p>
            </div>
          </div>

          <!-- Options Grid -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            ${task.options.map(opt => `
              <button 
                class="opt-btn ${userSelections[task.id] === opt ? 'selected' : ''}" 
                onclick="selectOption(${task.id}, '${opt}')"
              >
                ${opt}
              </button>
            `).join('')}
          </div>

          <!-- Actions & Result -->
          <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-2">
            <button class="mint-btn px-8 py-3.5 text-lg w-full sm:w-auto flex items-center justify-center gap-2" onclick="checkTask(${task.id})">
              Check Answers 🎯
            </button>
            <div id="result-${task.id}" class="text-xl font-black min-h-[32px] text-center sm:text-right"></div>
          </div>

        </div>
      `}).join('');

      updateProgress();
    }

    function selectOption(taskId, option) {
      userSelections[taskId] = option;
      renderTasks();
    }

    function checkTask(taskId) {
      const task = tasksData.find(t => t.id === taskId);
      const selected = userSelections[taskId];
      const resultDiv = document.getElementById(`result-${taskId}`);
      const badgeDiv = document.getElementById(`badge-${taskId}`);

      if (!selected) {
        resultDiv.innerText = "Please select an answer first!";
        resultDiv.className = "text-amber-600 font-bold text-lg";
        return;
      }

      if (selected === task.correctAnswer) {
        resultDiv.innerText = `🎉 Excellent! ${task.summaryText}`;
        resultDiv.className = "text-emerald-600 font-black text-xl";
        
        badgeDiv.innerText = "✓ Correct";
        badgeDiv.className = "correct-badge text-sm font-bold px-3 py-1 rounded-full block";
        taskStatus[taskId] = true;
      } else {
        resultDiv.innerText = "❌ Incorrect! Try again.";
        resultDiv.className = "text-red-600 font-black text-xl";
        
        badgeDiv.innerText = "✕ Try Again";
        badgeDiv.className = "incorrect-badge text-sm font-bold px-3 py-1 rounded-full block";
        taskStatus[taskId] = false;
      }

      updateProgress();
    }

    function updateProgress() {
      const completed = Object.values(taskStatus).filter(Boolean).length;
      document.getElementById("completedCount").innerText = completed;
    }

    function resetAll() {
      userSelections = {};
      taskStatus = {};
      renderTasks();
    }

    // Initial Render
    renderTasks();
  </script>
</body>
</html>
