<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class 1 - Econova Kids 🎨</title>
  
  <!-- Google Fonts: Outfit & Quicksand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Vanilla Tilt JS for 3D Card Hover Effects -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

  <style>
    :root {
      --font-main: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
      --font-heading: 'Outfit', 'Quicksand', sans-serif;
    }

    body {
      font-family: var(--font-main);
      background-color: #f0fdf4; /* Light Mint */
      color: #1f2937; /* Dark Gray */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    h1, h2, h3, .brand-logo, .hero-title, .card-title {
      font-family: var(--font-heading);
    }

    /* Mint Header */
    header {
      background-color: #2dd4bf; /* Mint Teal */
      border-bottom: 4px solid #10b981;
    }

    .brand-logo {
      color: #fde047; /* Yellow Accent */
      text-shadow: 2px 2px 0px #059669;
    }

    /* Mint Card Styling */
    .mint-card {
      background-color: #ffffff;
      border: 3px solid #34d399;
      border-radius: 24px;
      transition: all 0.3s ease;
      transform-style: preserve-3d;
    }

    .mint-card:hover {
      border-color: #10b981;
      transform: translateY(-8px);
      box-shadow: 0 20px 35px rgba(16, 185, 129, 0.18);
    }

    /* Secondary / Action Button Styling */
    .btn-red {
      background-color: #ff0000;
      color: #ffffff;
      border-radius: 50px;
      transition: all 0.2s ease;
    }

    .btn-red:hover {
      background-color: #cc0000;
      transform: scale(1.05);
    }

    .mint-btn {
      background-color: #10b981;
      color: #ffffff;
      font-weight: 800;
      border-radius: 16px;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .mint-btn:hover {
      background-color: #059669;
      transform: scale(1.03);
    }

    /* Cute Badge Floating Container */
    .icon-box {
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0fdf4;
      border-radius: 50%;
      border: 4px dashed #a7f3d0;
      animation: gentle-bounce 3s ease-in-out infinite;
      position: relative;
    }

    @keyframes gentle-bounce {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
    }

    /* 3D Text Graphics Style */
    .text-3d-abc {
      font-family: var(--font-heading);
      font-size: 2.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, #3b82f6, #ec4899, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(3px 4px 0px rgba(0,0,0,0.15));
      letter-spacing: 2px;
    }

    .text-3d-123 {
      font-family: var(--font-heading);
      font-size: 2.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, #10b981, #f59e0b, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(3px 4px 0px rgba(0,0,0,0.15));
      letter-spacing: 2px;
    }
  </style>
</head>
<body class="p-0">

  <!-- Header -->
  <header class="p-4 sm:p-6 shadow-md flex justify-between items-center px-6 sm:px-12">
    <a href="../index.html" class="brand-logo text-2xl sm:text-3xl font-extrabold tracking-wide no-underline">
      ✨ ECONOVA KIDS
    </a>
    <a href="../index.html" class="btn-red px-5 py-2 font-extrabold text-sm sm:text-base shadow-md no-underline flex items-center gap-1">
      🏠 Home
    </a>
  </header>

  <!-- Main Area -->
  <main class="flex-1 flex flex-col items-center justify-center text-center p-6 space-y-6 max-w-6xl mx-auto w-full">
    
    <div>
      <h1 class="hero-title text-4xl sm:text-6xl font-black text-emerald-600 mb-2">
        Class 1 World 🚀
      </h1>
      <p class="text-lg sm:text-xl font-bold text-gray-700 bg-emerald-100/60 py-2 px-6 rounded-full inline-block border border-emerald-300">
        Pick a subject & start your adventure!
      </p>
    </div>

    <!-- Cards Container -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-5xl pt-4">

      <!-- English Card (3D ABC) -->
      <a href="english/index.html" class="mint-card p-6 flex flex-col items-center justify-between no-underline space-y-4 shadow-lg" data-tilt data-tilt-max="10" data-tilt-speed="400">
        <div class="icon-box">
          <div class="text-3d-abc">ABC</div>
        </div>
        <h2 class="card-title text-3xl font-extrabold text-blue-600">ENGLISH</h2>
        <span class="mint-btn px-6 py-3 text-base font-bold w-full shadow-md flex items-center justify-center gap-2">
          Explore 🔤
        </span>
      </a>

      <!-- Maths Card (3D 123) -->
      <a href="maths/index.html" class="mint-card p-6 flex flex-col items-center justify-between no-underline space-y-4 shadow-lg" data-tilt data-tilt-max="10" data-tilt-speed="400">
        <div class="icon-box">
          <div class="text-3d-123">123</div>
        </div>
        <h2 class="card-title text-3xl font-extrabold text-emerald-600">MATHS</h2>
        <span class="mint-btn px-6 py-3 text-base font-bold w-full shadow-md flex items-center justify-center gap-2">
          Explore 🔢
        </span>
      </a>

      <!-- Science Card (Cute Science Flask & Atom - NO Medical Equipment) -->
      <a href="science/index.html" class="mint-card p-6 flex flex-col items-center justify-between no-underline space-y-4 shadow-lg" data-tilt data-tilt-max="10" data-tilt-speed="400">
        <div class="icon-box">
          <svg width="80" height="80" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Flask Body -->
            <path d="M26 12H38V22L48 42C50.5 47 47 52 41 52H23C17 52 13.5 47 16 42L26 22V12Z" fill="#f59e0b" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>
            <!-- Liquid -->
            <path d="M19 40L23 32H41L45 40C47 44 44 48 39 48H25C20 48 17 44 19 40Z" fill="#10b981"/>
            <!-- Bubbles -->
            <circle cx="28" cy="40" r="2.5" fill="#ffffff" opacity="0.8"/>
            <circle cx="35" cy="36" r="1.5" fill="#ffffff" opacity="0.8"/>
            <circle cx="32" cy="24" r="2" fill="#10b981"/>
            <!-- Flask Neck Rim -->
            <rect x="23" y="8" width="18" height="5" rx="2.5" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
          </svg>
        </div>
        <h2 class="card-title text-3xl font-extrabold text-amber-600">SCIENCE</h2>
        <span class="mint-btn px-6 py-3 text-base font-bold w-full shadow-md flex items-center justify-center gap-2">
          Explore 🧪
        </span>
      </a>

    </div>

  </main>

  <!-- 3D Tilt Script Initialization -->
  <script>
    if (window.innerWidth > 768) {
      VanillaTilt.init(document.querySelectorAll(".mint-card"));
    }
  </script>

</body>
</html>
