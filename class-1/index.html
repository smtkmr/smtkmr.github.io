<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class 1 - Econova Kids 🎨</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Header */
    header {
      background: #7bdcb5;
      padding: 15px 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 6px solid #10ac84;
      box-shadow: 0 8px 15px rgba(0,0,0,0.15);
    }

    .logo-badge {
      background: #ff4757;
      color: #fff;
      padding: 10px 24px;
      border-radius: 50px;
      font-family: 'Fredoka One', cursive;
      font-size: 2.2rem;
      border: 4px solid #fff;
      box-shadow: 0 6px 0px rgba(0,0,0,0.2);
      text-shadow: 2px 2px 0px #000;
      text-decoration: none;
    }

    /* Back Button to Main Home Page */
    .back-btn {
      background: #feca57;
      color: #2f3542;
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      padding: 10px 24px;
      border: 4px solid #fff;
      border-radius: 40px;
      text-decoration: none;
      box-shadow: 0 6px 0px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      transform: translateY(-3px) scale(1.05);
      background: #ff9ff3;
    }

    /* Main Container */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }

    .title {
      font-family: 'Fredoka One', cursive;
      font-size: 3.5rem;
      color: #fff;
      text-shadow: 4px 4px 0px #000;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.5rem;
      color: #2f3542;
      background: rgba(255, 255, 255, 0.8);
      padding: 8px 25px;
      border-radius: 30px;
      font-weight: bold;
      margin-bottom: 3rem;
    }

    /* Subjects Grid */
    .subjects-grid {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      max-width: 1000px;
      width: 100%;
    }

    .subject-card {
      width: 260px;
      padding: 2.5rem 1.5rem;
      border-radius: 40px;
      text-decoration: none;
      color: #fff;
      border: 6px solid #fff;
      box-shadow: 0 12px 0px rgba(0,0,0,0.2);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .subject-card:hover {
      transform: translateY(-12px) scale(1.05) rotate(2deg);
      box-shadow: 0 18px 0px rgba(0,0,0,0.25);
    }

    .subject-card .visual-icon {
      font-size: 5rem;
      margin-bottom: 15px;
      filter: drop-shadow(0px 8px 4px rgba(0,0,0,0.2));
      animation: bounce 2.5s infinite ease-in-out;
    }

    .subject-card h2 {
      font-family: 'Fredoka One', cursive;
      font-size: 2.2rem;
      text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
    }

    /* Subject Card Colors */
    .card-english {
      background: linear-gradient(145deg, #1e90ff, #70a1ff);
    }

    .card-maths {
      background: linear-gradient(145deg, #ff4757, #ff6b81);
    }

    .card-science {
      background: linear-gradient(145deg, #2ed573, #7bed9f);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <a href="../index.html" class="logo-badge">Econova</a>
    <a href="../index.html" class="back-btn">🏠 Home</a>
  </header>

  <!-- Main Content Area -->
  <main class="main-container">
    <h1 class="title">CLASS 1 SUBJECTS 🎨</h1>
    <p class="subtitle">Select a subject to start learning!</p>

    <div class="subjects-grid">
      
      <!-- English Folder Link -->
      <a href="english/index.html" class="subject-card card-english">
        <div class="visual-icon">🔤</div>
        <h2>ENGLISH</h2>
      </a>

      <!-- Maths Folder Link -->
      <a href="maths/index.html" class="subject-card card-maths">
        <div class="visual-icon">🔢</div>
        <h2>MATHS</h2>
      </a>

      <!-- Science Folder Link -->
      <a href="science/index.html" class="subject-card card-science">
        <div class="visual-icon">🧪</div>
        <h2>SCIENCE</h2>
      </a>

    </div>
  </main>

</body>
</html>
