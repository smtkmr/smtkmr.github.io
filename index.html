<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Econova Kids Learning 🎈</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Fredoka', cursive, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Top Navigation Bar */
    header {
      background: #ffffff;
      padding: 0.8rem 2rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 2.2rem;
      font-weight: 700;
      color: #FF3366;
      text-shadow: 2px 2px 0px #FFD700;
      letter-spacing: 1px;
    }

    /* Horizontal Class Navigation Bar */
    .class-nav {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .class-btn {
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      box-shadow: 0 4px 0px rgba(0,0,0,0.2);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: inline-block;
    }

    .class-btn:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 8px 0px rgba(0,0,0,0.2);
    }

    /* Individual Color Themes for Classes */
    .c1 { background: #FF4757; }
    .c2 { background: #2ED573; }
    .c3 { background: #FFA502; }
    .c4 { background: #1E90FF; }
    .c5 { background: #9B59B6; }

    /* Hero / Park Playground Section */
    .hero-park {
      text-align: center;
      padding: 3rem 1rem;
    }

    .hero-title {
      font-size: 3rem;
      color: #FF4757;
      text-shadow: 3px 3px 0px #FFF, 5px 5px 0px #2ED573;
      margin-bottom: 10px;
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.03); }
    }

    .hero-subtitle {
      font-size: 1.4rem;
      color: #2F3542;
      background: rgba(255, 255, 255, 0.6);
      display: inline-block;
      padding: 6px 20px;
      border-radius: 20px;
    }

    /* Main Showcase Cards */
    .playground {
      max-width: 1100px;
      margin: 1rem auto 4rem;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      padding: 0 1rem;
    }

    .park-card {
      width: 180px;
      height: 220px;
      border-radius: 24px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      box-shadow: 0 10px 0px rgba(0,0,0,0.15);
      transition: all 0.3s ease;
      position: relative;
    }

    .park-card:hover {
      transform: translateY(-10px) rotate(-2deg);
    }

    .park-card .icon {
      font-size: 4rem;
      margin-bottom: 10px;
    }

    .park-card h2 {
      font-size: 1.6rem;
    }
  </style>
</head>
<body>

  <!-- Top Navbar with Horizontal Class Buttons -->
  <header>
    <div class="logo">Econova Kids 🎈</div>
    <nav class="class-nav">
      <a href="class-1/index.html" class="class-btn c1">Class 1</a>
      <a href="class-2/index.html" class="class-btn c2">Class 2</a>
      <a href="class-3/index.html" class="class-btn c3">Class 3</a>
      <a href="class-4/index.html" class="class-btn c4">Class 4</a>
      <a href="class-5/index.html" class="class-btn c5">Class 5</a>
    </nav>
  </header>

  <!-- Fun Park Area -->
  <section class="hero-park">
    <h1 class="hero-title">Welcome to the Fun Park! 🎮🚀</h1>
    <p class="hero-subtitle">Upar di gayi buttons se apni class chuno aur seekhna shuru karo!</p>
  </section>

  <!-- Interactive Class Cards Area -->
  <main class="playground">
    <a href="class-1/index.html" class="park-card c1">
      <div class="icon">🎨</div>
      <h2>Class 1</h2>
    </a>
    <a href="class-2/index.html" class="park-card c2">
      <div class="icon">🚀</div>
      <h2>Class 2</h2>
    </a>
    <a href="class-3/index.html" class="park-card c3">
      <div class="icon">🧩</div>
      <h2>Class 3</h2>
    </a>
    <a href="class-4/index.html" class="park-card c4">
      <div class="icon">💡</div>
      <h2>Class 4</h2>
    </a>
    <a href="class-5/index.html" class="park-card c5">
      <div class="icon">⭐</div>
      <h2>Class 5</h2>
    </a>
  </main>

</body>
</html>
