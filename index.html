<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Econova Kids Learning 🎈</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      min-height: 100vh;
      /* Vibrant Playground Background with 3D Numbers, Letters & Kids Vibe */
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Navigation Header */
    header {
      background: #7bdcb5;
      padding: 15px 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 6px solid #10ac84;
      box-shadow: 0 8px 15px rgba(0,0,0,0.15);
      position: relative;
      z-index: 1000;
    }

    .logo-badge {
      background: #ff4757;
      color: #fff;
      padding: 10px 24px;
      border-radius: 50px;
      font-family: 'Fredoka One', cursive;
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 4px solid #fff;
      box-shadow: 0 6px 0px rgba(0,0,0,0.2);
      text-shadow: 2px 2px 0px #000;
    }

    /* Single Class Dropdown Container */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    /* CLASS Button Style */
    .dropbtn {
      background: #feca57;
      color: #2f3542;
      font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      padding: 12px 30px;
      border: 4px solid #fff;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 0px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dropbtn:hover {
      transform: translateY(-3px) scale(1.05);
      background: #ff9ff3;
    }

    /* Dropdown Menu Content */
    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      top: 65px;
      background-color: #fff;
      min-width: 200px;
      border-radius: 20px;
      border: 4px solid #10ac84;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.25);
      overflow: hidden;
      z-index: 1001;
    }

    .dropdown-content a {
      color: #2f3542;
      padding: 14px 20px;
      text-decoration: none;
      display: block;
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      transition: background 0.2s ease;
      border-bottom: 2px dashed #f1f2f6;
    }

    .dropdown-content a:last-child {
      border-bottom: none;
    }

    .dropdown-content a:hover {
      background-color: #ff4757;
      color: #fff;
    }

    /* Show Dropdown on Hover */
    .dropdown:hover .dropdown-content {
      display: block;
    }

    /* Playground Area (Full Page Display) */
    .hero-playground {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
    }

    /* Floating 3D Elements Effect */
    .floating-3d {
      font-family: 'Fredoka One', cursive;
      font-size: 5rem;
      display: flex;
      gap: 25px;
      margin: 1.5rem 0;
      text-shadow: 5px 5px 0px #fff, 8px 8px 0px rgba(0,0,0,0.15);
    }

    .num-1 { color: #ff4757; animation: float 3s ease-in-out infinite; }
    .num-a { color: #2ed573; animation: float 3s ease-in-out 0.5s infinite; }
    .num-2 { color: #ffa502; animation: float 3s ease-in-out 1s infinite; }
    .num-b { color: #1e90ff; animation: float 3s ease-in-out 1.5s infinite; }
    .num-3 { color: #9b59b6; animation: float 3s ease-in-out 2s infinite; }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }

    .kids-art {
      font-size: 6rem;
      margin-top: 1rem;
      filter: drop-shadow(0px 10px 8px rgba(0,0,0,0.15));
    }

    .welcome-title {
      font-family: 'Fredoka One', cursive;
      font-size: 3.5rem;
      color: #fff;
      text-shadow: 4px 4px 0px #000;
      margin-bottom: 10px;
    }

    .welcome-sub {
      font-size: 1.6rem;
      color: #2f3542;
      background: rgba(255, 255, 255, 0.7);
      padding: 8px 25px;
      border-radius: 30px;
      font-weight: bold;
    }

  </style>
</head>
<body>

  <!-- Header with Single CLASS Dropdown Button -->
  <header>
    <div class="logo-badge">Econova</div>
    
    <div class="dropdown">
      <button class="dropbtn">CLASS ▾</button>
      <div class="dropdown-content">
        <a href="class-1/index.html">🎨 Class 1</a>
        <a href="class-2/index.html">🚀 Class 2</a>
        <a href="class-3/index.html">🧩 Class 3</a>
        <a href="class-4/index.html">💡 Class 4</a>
        <a href="class-5/index.html">⭐ Class 5</a>
      </div>
    </div>
  </header>

  <!-- Full Page 3D Playground Theme -->
  <main class="hero-playground">
    <h1 class="welcome-title">ECONOVA KIDS PARK! 🎈</h1>
    <p class="welcome-sub">Click the CLASS button above to start learning!</p>

    <!-- Floating 3D Numbers & ABCD Graphics -->
    <div class="floating-3d">
      <span class="num-1">1</span>
      <span class="num-a">A</span>
      <span class="num-2">2</span>
      <span class="num-b">B</span>
      <span class="num-3">3</span>
    </div>

    <!-- Kids Playing Vibe Art -->
    <div class="kids-art">
      🤾‍♀️ 🧩 🏃‍♂️ 📚 🎨
    </div>
  </main>

</body>
</html>
