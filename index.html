<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>econova.vip - Class 1 Learning Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      user-select: none;
      background-color: #f0fdf4;
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
    }
    .mint-header { background-color: #2dd4bf; }
    .mint-border-card {
      background-color: #ffffff;
      border: 3px solid #34d399;
      border-radius: 24px;
    }
    .mint-btn {
      background-color: #10b981;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .mint-btn:hover {
      background-color: #059669;
      transform: scale(1.03);
    }
  </style>
</head>
<body class="p-3 sm:p-6 text-gray-800">

  <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-2xl border-4 border-emerald-400 overflow-hidden">
    
    <!-- HEADER -->
    <header class="mint-header p-4 sm:p-6 text-white flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-4xl">✨</span>
        <div>
          <h1 class="text-3xl font-extrabold text-yellow-300">econova.vip</h1>
          <p class="text-emerald-900 font-bold text-sm">Class 1 Math</p>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="p-4 sm:p-8 space-y-6" id="appContainer">
      <div class="text-center py-12 text-gray-500 font-bold">
        Loading topic content...
      </div>
    </main>

  </div>

  <!-- UNIVERSAL RENDER ENGINE -->
  <script>
    window.loadTopic = function(data) {
      const container = document.getElementById('appContainer');
      container.innerHTML = '';

      // 1. TOPIC TITLE
      const headerBox = document.createElement('div');
      headerBox.className = 'flex items-center justify-between border-b-4 border-emerald-100 pb-4';
      headerBox.innerHTML = `
        <div>
          <h2 class="text-2xl sm:text-3xl font-black text-emerald-700">${data.title}</h2>
          <span class="inline-block mt-2 text-xs font-black px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300">Status: Active</span>
        </div>
      `;
      container.appendChild(headerBox);

      // 2. INSTRUCTION / GUIDE BOX
      if (data.guide) {
        const guideBox = document.createElement('div');
        guideBox.className = 'bg-purple-50 border-3 border-purple-300 rounded-3xl p-5 shadow-sm space-y-3';
        guideBox.innerHTML = `
          <h3 class="text-lg font-black text-purple-900 flex items-center gap-2">
            <span>🎲</span> ${data.guide.title}
          </h3>
          <p class="text-xs sm:text-sm font-bold text-purple-800 leading-relaxed">${data.guide.rules}</p>
        `;
        container.appendChild(guideBox);
      }

      // 3. INTERACTIVE BINGO GRID
      if (data.type === 'bingo') {
        const gridBox = document.createElement('div');
        gridBox.className = 'mint-border-card p-5 space-y-4';
        
        let gridHtml = data.board.map(num => `
          <button onclick="toggleBingoCell(this)" class="p-4 bg-emerald-100 border-2 border-emerald-400 rounded-2xl font-black text-2xl text-emerald-900 hover:bg-emerald-200 transition-all">${num}</button>
        `).join('');

        gridBox.innerHTML = `
          <h4 class="text-lg font-black text-emerald-800 border-b-2 border-emerald-100 pb-2 flex justify-between items-center">
            <span>🎯 Practice Board: Interactive Bingo Grid</span>
            <span class="text-xs font-bold text-emerald-600 bg-emerald-100 px-3 py-1 rounded-full">Click numbers to mark</span>
          </h4>
          <div class="grid grid-cols-3 gap-3 max-w-xs mx-auto my-4 text-center">${gridHtml}</div>
        `;
        container.appendChild(gridBox);
      }

      // 4. QUIZ / WORKSHEET FORM
      if (data.questions && data.questions.length > 0) {
        const form = document.createElement('form');
        form.className = 'space-y-6';
        
        let questionsHtml = data.questions.map((q, idx) => `
          <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-200 space-y-3 text-center">
            <p class="font-black text-lg text-emerald-900">${q.problem}</p>
            <input type="number" id="q_${idx}" data-correct="${q.correct}" placeholder="Sum" class="w-24 p-2 text-center rounded-xl border-2 border-emerald-400 font-bold bg-white">
            <div id="sol_${idx}" class="hidden text-xs font-bold p-2 rounded-xl mt-2 text-left"></div>
          </div>
        `).join('');

        form.innerHTML = `
          <div class="mint-border-card p-5 space-y-4">
            <h4 class="text-lg font-black text-emerald-800 border-b-2 border-emerald-100 pb-2">📌 Practice Questions</h4>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">${questionsHtml}</div>
          </div>
          <div class="text-center pt-2">
            <button type="submit" class="mint-btn px-10 py-4 text-white font-black text-lg rounded-2xl shadow-xl">Check Answers ✨</button>
          </div>
        `;

        form.onsubmit = function(e) {
          e.preventDefault();
          checkAnswers(data.questions.length);
        };

        container.appendChild(form);
      }
    };

    function toggleBingoCell(btn) {
      if (btn.classList.contains('bg-yellow-300')) {
        btn.classList.remove('bg-yellow-300', 'text-yellow-900');
        btn.classList.add('bg-emerald-100', 'text-emerald-900');
      } else {
        btn.classList.remove('bg-emerald-100', 'text-emerald-900');
        btn.classList.add('bg-yellow-300', 'text-yellow-900');
      }
    }

    function checkAnswers(total) {
      let score = 0;
      for (let i = 0; i < total; i++) {
        const input = document.getElementById(`q_${i}`);
        const sol = document.getElementById(`sol_${i}`);
        sol.classList.remove('hidden');

        if (input.value.trim() === input.getAttribute('data-correct')) {
          score++;
          sol.className = "text-xs font-bold p-2 rounded-xl mt-2 bg-emerald-100 text-emerald-800 border border-emerald-300";
          sol.innerHTML = `✅ Correct!`;
        } else {
          sol.className = "text-xs font-bold p-2 rounded-xl mt-2 bg-red-100 text-red-800 border border-red-300";
          sol.innerHTML = `❌ Answer is ${input.getAttribute('data-correct')}`;
        }
      }

      if (score === total) {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }
    }
  </script>

  <!-- TOPIC DATA (AAGE SE SIRF IS SCRIPT TAG KE ANDAR KA CONTENT BADALNA HOGA) -->
  <script>
    loadTopic({
      title: "Game: Addition Bingo",
      type: "bingo",
      guide: {
        title: "How to Play Addition Bingo!",
        rules: "1. Solve the addition problem.<br>2. Find the sum on your Bingo board.<br>3. Fill 3 numbers in a row to call <b>BINGO!</b> 🎉"
      },
      board: [2, 5, 3, 1, 4, 6, 3, 2, 4],
      questions: [
        { problem: "1 + 2 = ?", correct: "3" },
        { problem: "3 + 2 = ?", correct: "5" },
        { problem: "2 + 2 = ?", correct: "4" }
      ]
    });
  </script>

</body>
</html>
