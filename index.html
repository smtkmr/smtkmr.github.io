<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>econova.vip - Class 1 Learning Portal</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Confetti Effect -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
      background-color: #f0fdf4;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
    }

    .mint-header {
      background-color: #2dd4bf;
    }

    .mint-border-card {
      background-color: #ffffff;
      border: 3px solid #34d399;
      border-radius: 24px;
    }

    .mint-text {
      color: #059669;
    }

    .mint-btn {
      background-color: #10b981;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .mint-btn:hover {
      background-color: #059669;
      transform: scale(1.03);
    }

    .yt-btn {
      background-color: #ff0000;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(255, 0, 0, 0.25);
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .yt-btn:hover {
      background-color: #cc0000;
      transform: scale(1.04);
    }

    .card-hover {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.2);
    }

    .accordion-header {
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body class="p-3 sm:p-6 text-gray-800">

  <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-2xl border-4 border-emerald-400 overflow-hidden">
    
    <!-- TOP HEADER -->
    <header class="mint-header p-4 sm:p-6 text-white flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <span class="text-4xl animate-bounce">✨</span>
        <div>
          <h1 class="text-3xl sm:text-4xl font-extrabold text-yellow-300 drop-shadow-md">econova.vip</h1>
          <p class="text-emerald-900 font-bold text-sm sm:text-base">Student Portal: <span id="studentName">Class 1 Math</span></p>
        </div>
      </div>

      <!-- PROGRESS TRACKER -->
      <div class="bg-white/20 backdrop-blur-md px-4 py-2 rounded-2xl border-2 border-white/40 min-w-[200px]">
        <div class="flex justify-between items-center text-xs font-black text-emerald-950 uppercase mb-1">
          <span>Overall Progress</span>
          <span id="progressText" class="text-yellow-300 text-sm">0%</span>
        </div>
        <div class="w-full bg-emerald-800/40 h-3.5 rounded-full overflow-hidden p-0.5 border border-white/30">
          <div id="progressBar" class="bg-yellow-300 h-full rounded-full transition-all duration-500 w-0"></div>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="p-4 sm:p-8 space-y-6">

      <!-- STEP 1: CLASS SELECTION -->
      <section id="stepClass" class="space-y-6">
        <div class="mint-border-card p-4 sm:p-6 text-center">
          <h2 class="text-2xl sm:text-3xl font-black mint-text flex items-center justify-center gap-2">
            <span>👇</span> SELECT YOUR CLASS / GRADE:
          </h2>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 sm:gap-6">
          <button onclick="selectClass('Class 1')" class="card-hover p-6 bg-emerald-50 border-3 border-emerald-300 hover:border-emerald-500 rounded-3xl font-black text-emerald-800 text-xl shadow-md flex flex-col items-center gap-2">
            <span class="text-4xl">🎒</span> Class 1
          </button>
          <button class="p-6 bg-gray-100 border-3 border-gray-300 rounded-3xl font-black text-gray-400 text-xl shadow-md flex flex-col items-center gap-2 opacity-60" disabled>
            <span class="text-4xl">📚</span> Class 2 (Soon)
          </button>
          <button class="p-6 bg-gray-100 border-3 border-gray-300 rounded-3xl font-black text-gray-400 text-xl shadow-md flex flex-col items-center gap-2 opacity-60" disabled>
            <span class="text-4xl">🎨</span> Class 3 (Soon)
          </button>
        </div>
      </section>

      <!-- STEP 2: SUBJECT SELECTION -->
      <section id="stepSubject" class="space-y-6 hidden">
        <div class="flex items-center justify-between">
          <h2 class="text-2xl font-black mint-text">Select Subject (<span id="selectedClassLabel" class="text-amber-500"></span>)</h2>
          <button onclick="goBack('stepClass')" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 font-extrabold text-gray-700 rounded-xl shadow text-sm">← Change Class</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 sm:gap-6">
          <button onclick="selectSubject('Mathematics')" class="card-hover p-6 bg-amber-50 border-3 border-amber-300 hover:border-amber-500 rounded-3xl font-black text-amber-900 text-xl shadow-md flex flex-col items-center gap-2">
            <span class="text-5xl">🔢</span> Mathematics
          </button>
          <button class="p-6 bg-gray-100 border-3 border-gray-200 rounded-3xl font-black text-gray-400 text-xl shadow-md flex flex-col items-center gap-2 opacity-60" disabled>
            <span class="text-5xl">🔬</span> Science (Soon)
          </button>
          <button class="p-6 bg-gray-100 border-3 border-gray-200 rounded-3xl font-black text-gray-400 text-xl shadow-md flex flex-col items-center gap-2 opacity-60" disabled>
            <span class="text-5xl">📖</span> English (Soon)
          </button>
        </div>
      </section>

      <!-- STEP 3: CHAPTERS & TOPICS LIST -->
      <section id="stepTopic" class="space-y-6 hidden">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-2xl font-black mint-text">Class 1 Mathematics</h2>
            <p class="text-xs font-bold text-gray-500">Complete Syllabus (Chapters 1 to 12)</p>
          </div>
          <button onclick="goBack('stepSubject')" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 font-extrabold text-gray-700 rounded-xl shadow text-sm">← Back</button>
        </div>

        <div id="chapterAccordion" class="space-y-4"></div>
      </section>

      <!-- STEP 4: TOPIC CONTENT CONTAINER -->
      <section id="stepContent" class="space-y-8 hidden">
        
        <div class="flex flex-wrap items-center justify-between gap-3 border-b-4 border-emerald-100 pb-4">
          <div>
            <h2 id="topicTitle" class="text-2xl sm:text-3xl font-black text-emerald-700"></h2>
            <span id="topicStatus" class="inline-block mt-2 text-xs font-black px-3 py-1 rounded-full bg-yellow-100 text-yellow-800 border border-yellow-300">Status: Incomplete</span>
          </div>
          <button onclick="goBack('stepTopic')" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 font-extrabold text-gray-700 rounded-xl shadow text-sm">← Back to Chapters</button>
        </div>

        <!-- VIDEO CONTAINER (HIDDEN BY DEFAULT) -->
        <div id="videoContainer" class="bg-red-50 border-3 border-red-300 p-5 rounded-3xl flex-col sm:flex-row items-center justify-between gap-4 shadow-sm hidden">
          <div class="flex items-center gap-3 text-center sm:text-left">
            <span class="text-4xl">📺</span>
            <div>
              <h3 class="text-lg font-black text-red-900">Watch Video Lesson</h3>
              <p class="text-xs font-bold text-red-700">Watch video explanation before starting!</p>
            </div>
          </div>
          <a id="youtubeLessonBtn" href="#" target="_blank" class="yt-btn px-6 py-3 font-black rounded-2xl flex items-center gap-2 text-base shadow-lg shrink-0">
            <span>Play Video</span> ▶
          </a>
        </div>

        <!-- DYNAMIC CONTENT / WORKSHEET -->
        <div id="subtopicContainer" class="space-y-6"></div>

      </section>

    </main>
  </div>

  <script>
    const syllabusData = [
      {
        chapterId: "ch1",
        title: "Chapter 1: Addition Concepts",
        subtopics: [
          { id: "c1_s01", title: "Show What You Know", hasContent: true, hasVideo: false },
          { id: "c1_s02", title: "Vocabulary Builder", hasContent: true, hasVideo: false },
          { id: "c1_s03", title: "Game: Addition Bingo", hasContent: false, hasVideo: false },
          { id: "c1_s04", title: "1.1 Algebra • Use Pictures to Add To", hasContent: false, hasVideo: false },
          { id: "c1_s05", title: "1.2 Hands On • Model Adding To", hasContent: false, hasVideo: false },
          { id: "c1_s06", title: "1.3 Hands On • Model Putting Together", hasContent: false, hasVideo: false },
          { id: "c1_s07", title: "1.4 Problem Solving • Model Addition", hasContent: false, hasVideo: false },
          { id: "c1_s08", title: "Mid-Chapter Checkpoint", hasContent: false, hasVideo: false },
          { id: "c1_s09", title: "1.5 Algebra • Add Zero", hasContent: false, hasVideo: false },
          { id: "c1_s10", title: "1.6 Hands On: Algebra • Add in Any Order", hasContent: false, hasVideo: false },
          { id: "c1_s11", title: "1.7 Hands On: Algebra • Put Together Numbers to 10", hasContent: false, hasVideo: false },
          { id: "c1_s12", title: "1.8 Addition to 10", hasContent: false, hasVideo: false },
          { id: "c1_s13", title: "Chapter 1 Review/Test & Performance Task", hasContent: false, hasVideo: false }
        ]
      }
    ];

    let selectedClass = "Class 1";
    let selectedSubject = "Mathematics";
    let activeSubtopic = null;
    let completedSubtopics = JSON.parse(localStorage.getItem('econova_completed_subtopics')) || [];

    // Initialize progress on page load
    document.addEventListener('DOMContentLoaded', () => {
      updateProgress();
    });

    function updateProgress() {
      let total = 0;
      syllabusData.forEach(c => total += c.subtopics.length);
      const percentage = Math.min(100, Math.round((completedSubtopics.length / total) * 100));
      document.getElementById('progressBar').style.width = percentage + '%';
      document.getElementById('progressText').innerText = percentage + '%';
    }

    function selectClass(className) {
      selectedClass = className;
      document.getElementById('selectedClassLabel').innerText = className;
      document.getElementById('stepClass').classList.add('hidden');
      document.getElementById('stepSubject').classList.remove('hidden');
    }

    function selectSubject(subjectName) {
      selectedSubject = subjectName;
      document.getElementById('stepSubject').classList.add('hidden');
      document.getElementById('stepTopic').classList.remove('hidden');
      renderAccordion();
    }

    function goBack(targetStep) {
      document.getElementById('stepClass').classList.add('hidden');
      document.getElementById('stepSubject').classList.add('hidden');
      document.getElementById('stepTopic').classList.add('hidden');
      document.getElementById('stepContent').classList.add('hidden');

      document.getElementById(targetStep).classList.remove('hidden');
    }

    function renderAccordion() {
      const container = document.getElementById('chapterAccordion');
      container.innerHTML = '';

      syllabusData.forEach((ch, idx) => {
        const isFirst = idx === 0;
        let subitemsHtml = ch.subtopics.map(sub => {
          const isDone = completedSubtopics.includes(sub.id);
          const hasContentTag = sub.hasContent 
            ? `<span class="bg-emerald-100 text-emerald-800 text-[10px] px-2 py-0.5 rounded-full font-black border border-emerald-300">Ready</span>` 
            : `<span class="bg-gray-100 text-gray-500 text-[10px] px-2 py-0.5 rounded-full font-bold">Pending</span>`;

          return `
            <div onclick="openSubtopic('${ch.chapterId}', '${sub.id}')" class="p-3 bg-white hover:bg-emerald-50 rounded-xl border border-gray-200 flex justify-between items-center cursor-pointer transition-all">
              <div class="flex items-center gap-2">
                <span class="text-lg">${isDone ? '✅' : '📄'}</span>
                <span class="font-black text-sm text-gray-800">${sub.title}</span>
              </div>
              <div class="flex items-center gap-2">
                ${hasContentTag}
                <span class="text-xs font-black text-emerald-600">➔</span>
              </div>
            </div>
          `;
        }).join('');

        container.innerHTML += `
          <div class="border-3 border-emerald-300 rounded-2xl overflow-hidden bg-white shadow-sm">
            <div onclick="toggleAccordion('${ch.chapterId}')" class="accordion-header bg-emerald-50 p-4 flex justify-between items-center font-black text-emerald-900 hover:bg-emerald-100">
              <div class="flex items-center gap-2 text-base sm:text-lg">
                <span>📚</span> ${ch.title}
              </div>
              <span id="icon-${ch.chapterId}" class="text-xl">${isFirst ? '➖' : '➕'}</span>
            </div>
            <div id="body-${ch.chapterId}" class="p-3 space-y-2 ${isFirst ? '' : 'hidden'} bg-slate-50 border-t border-emerald-200">
              ${subitemsHtml}
            </div>
          </div>
        `;
      });
    }

    function toggleAccordion(chId) {
      const body = document.getElementById(`body-${chId}`);
      const icon = document.getElementById(`icon-${chId}`);
      if (body.classList.contains('hidden')) {
        body.classList.remove('hidden');
        icon.innerText = '➖';
      } else {
        body.classList.add('hidden');
        icon.innerText = '➕';
      }
    }

    function openSubtopic(chId, subId) {
      const chapter = syllabusData.find(c => c.chapterId === chId);
      activeSubtopic = chapter.subtopics.find(s => s.id === subId);

      document.getElementById('stepTopic').classList.add('hidden');
      document.getElementById('stepContent').classList.remove('hidden');
      document.getElementById('topicTitle').innerText = `${chapter.title} - ${activeSubtopic.title}`;
      
      const videoBox = document.getElementById('videoContainer');
      if (activeSubtopic.hasVideo) {
        videoBox.classList.remove('hidden');
        videoBox.classList.add('flex');
      } else {
        videoBox.classList.add('hidden');
        videoBox.classList.remove('flex');
      }

      updateSubtopicStatusUI();

      const contentBox = document.getElementById('subtopicContainer');
      
      if (subId === 'c1_s01') {
        renderShowWhatYouKnow(contentBox);
      } else if (subId === 'c1_s02') {
        renderVocabularyBuilder(contentBox);
      } else {
        contentBox.innerHTML = `
          <div class="mint-border-card p-8 text-center space-y-3">
            <span class="text-5xl">🛠️</span>
            <h3 class="text-xl font-black text-gray-700">Aapka placeholder tayyar hai!</h3>
            <p class="text-sm text-gray-500 font-bold max-w-md mx-auto">
              Aap jab bhi is section <b>"${activeSubtopic.title}"</b> ka content denge, mai yahan par interactive content add kar dunga!
            </p>
          </div>
        `;
      }
    }

    function updateSubtopicStatusUI() {
      const isDone = completedSubtopics.includes(activeSubtopic.id);
      const statusEl = document.getElementById('topicStatus');
      if (isDone) {
        statusEl.innerText = "Status: Completed ✅";
        statusEl.className = "inline-block mt-2 text-xs font-black px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300";
      } else {
        statusEl.innerText = activeSubtopic.hasContent ? "Status: Ready to Practice" : "Status: Pending Content";
        statusEl.className = "inline-block mt-2 text-xs font-black px-3 py-1 rounded-full bg-yellow-100 text-yellow-800 border border-yellow-300";
      }
    }

    function markSubtopicComplete(subId) {
      if (!completedSubtopics.includes(subId)) {
        completedSubtopics.push(subId);
        localStorage.setItem('econova_completed_subtopics', JSON.stringify(completedSubtopics));
        updateProgress();
        updateSubtopicStatusUI();
      }
    }

    function renderShowWhatYouKnow(container) {
      container.innerHTML = `
        <div class="bg-amber-50 border-3 border-amber-300 rounded-3xl p-5 shadow-sm space-y-3">
          <h3 class="text-lg font-black text-amber-900 flex items-center gap-2">
            <span>💡</span> Easy Vocabulary & Meanings (Aasan Shabd-Arth)
          </h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm font-bold">
            <div class="bg-white p-3 rounded-2xl border border-amber-200">
              <span class="text-amber-700 font-black">Explore:</span> To look closely and learn (Khojna / Seekhna)
            </div>
            <div class="bg-white p-3 rounded-2xl border border-amber-200">
              <span class="text-amber-700 font-black">Objects:</span> Things you can see and touch (Cheezein / Vastu)
            </div>
            <div class="bg-white p-3 rounded-2xl border border-amber-200">
              <span class="text-amber-700 font-black">Group:</span> A collection of things together (Samooh)
            </div>
            <div class="bg-white p-3 rounded-2xl border border-amber-200">
              <span class="text-amber-700 font-black">Spots:</span> Small round marks or dots (Dhabbe / Bindu)
            </div>
          </div>
        </div>

        <form id="worksheetForm" onsubmit="evaluateWorksheet(event)" class="space-y-6">
          
          <!-- SECTION 1 -->
          <div class="mint-border-card p-5 space-y-4">
            <h4 class="text-lg font-black text-emerald-800 border-b-2 border-emerald-100 pb-2">
              📌 Section 1: Explore Numbers 1 to 4
            </h4>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-200 space-y-3">
                <p class="font-black text-gray-800">1. How many dots represent number <b>1</b>?</p>
                <div class="flex items-center gap-4">
                  <span class="text-2xl font-black text-emerald-700">1</span>
                  <select id="q1" class="p-2 rounded-xl border-2 border-emerald-400 font-bold bg-white text-gray-800">
                    <option value="">Select dots</option>
                    <option value="1">🔴 (1 Dot)</option>
                    <option value="2">🔴 🔴 (2 Dots)</option>
                    <option value="3">🔴 🔴 🔴 (3 Dots)</option>
                  </select>
                </div>
                <div id="sol1" class="hidden text-xs font-bold p-2 rounded-xl mt-2"></div>
              </div>

              <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-200 space-y-3">
                <p class="font-black text-gray-800">2. How many dots represent number <b>3</b>?</p>
                <div class="flex items-center gap-4">
                  <span class="text-2xl font-black text-emerald-700">3</span>
                  <select id="q2" class="p-2 rounded-xl border-2 border-emerald-400 font-bold bg-white text-gray-800">
                    <option value="">Select dots</option>
                    <option value="2">🔴 🔴 (2 Dots)</option>
                    <option value="3">🔴 🔴 🔴 (3 Dots)</option>
                    <option value="4">🔴 🔴 🔴 🔴 (4 Dots)</option>
                  </select>
                </div>
                <div id="sol2" class="hidden text-xs font-bold p-2 rounded-xl mt-2"></div>
              </div>
            </div>
          </div>

          <!-- SECTION 2 -->
          <div class="mint-border-card p-5 space-y-4">
            <h4 class="text-lg font-black text-emerald-800 border-b-2 border-emerald-100 pb-2">
              📌 Section 2: Numbers 1 to 10 (How many objects are in each group?)
            </h4>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <!-- Q3: Chicks -->
              <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-200 space-y-3 text-center">
                <div class="text-3xl flex justify-center gap-1">🐥🐥🐥🐥🐥</div>
                <p class="font-black text-gray-800">3. How many chicks?</p>
                <input type="number" id="q3" min="0" placeholder="Answer" class="w-24 p-2 text-center rounded-xl border-2 border-emerald-400 font-bold bg-white">
                <div id="sol3" class="hidden text-xs font-bold p-2 rounded-xl mt-2 text-left"></div>
              </div>

              <!-- Q4: Eggs in Nest -->
              <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-200 space-y-3 text-center">
                <div class="flex justify-center items-center bg-amber-200/60 p-2 rounded-2xl border-2 border-amber-400 min-h-[50px] gap-1">
                  <span class="text-2xl">🪹</span>
                  <div class="flex gap-1 text-xl">🥚🥚🥚🥚🥚</div>
                </div>
                <p class="font-black text-gray-800">4. How many eggs?</p>
                <input type="number" id="q4" min="0" placeholder="Answer" class="w-24 p-2 text-center rounded-xl border-2 border-emerald-400 font-bold bg-white">
                <div id="sol4" class="hidden text-xs font-bold p-2 rounded-xl mt-2 text-left"></div>
              </div>

              <!-- Q5: Flowers -->
              <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-200 space-y-3 text-center">
                <div class="text-3xl flex justify-center gap-1">🌸🌸🌸🌸🌸</div>
                <p class="font-black text-gray-800">5. How many flowers?</p>
                <input type="number" id="q5" min="0" placeholder="Answer" class="w-24 p-2 text-center rounded-xl border-2 border-emerald-400 font-bold bg-white">
                <div id="sol5" class="hidden text-xs font-bold p-2 rounded-xl mt-2 text-left"></div>
              </div>
            </div>
          </div>

          <!-- SECTION 3 -->
          <div class="mint-border-card p-5 space-y-4">
            <h4 class="text-lg font-black text-emerald-800 border-b-2 border-emerald-100 pb-2">
              📌 Section 3: Numbers 0 to 10 (How many spots are on the ladybug?)
            </h4>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
              <!-- Q6: Plain Ladybug (0 Spots) -->
              <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-200 space-y-2 text-center flex flex-col items-center">
                <svg width="60" height="60" viewBox="0 0 100 100">
                  <ellipse cx="50" cy="55" rx="35" ry="30" fill="#ef4444" stroke="#000" stroke-width="3"/>
                  <line x1="50" y1="25" x2="50" y2="85" stroke="#000" stroke-width="3"/>
                  <circle cx="50" cy="30" r="15" fill="#000"/>
                </svg>
                <p class="text-xs font-black text-gray-600">6. Plain Ladybug</p>
                <input type="number" id="q6" min="0" placeholder="Spots" class="w-20 p-2 text-center rounded-xl border-2 border-emerald-400 font-bold bg-white">
                <div id="sol6" class="hidden text-xs font-bold p-2 rounded-xl mt-2 text-left w-full"></div>
              </div>

              <!-- Q7: Ladybug with 4 Spots -->
              <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-200 space-y-2 text-center flex flex-col items-center">
                <svg width="60" height="60" viewBox="0 0 100 100">
                  <ellipse cx="50" cy="55" rx="35" ry="30" fill="#ef4444" stroke="#000" stroke-width="3"/>
                  <line x1="50" y1="25" x2="50" y2="85" stroke="#000" stroke-width="3"/>
                  <circle cx="50" cy="30" r="15" fill="#000"/>
                  <circle cx="32" cy="48" r="5" fill="#000"/>
                  <circle cx="68" cy="48" r="5" fill="#000"/>
                  <circle cx="32" cy="68" r="5" fill="#000"/>
                  <circle cx="68" cy="68" r="5" fill="#000"/>
                </svg>
                <p class="text-xs font-black text-gray-600">7. 4-Spot Ladybug</p>
                <input type="number" id="q7" min="0" placeholder="Spots" class="w-20 p-2 text-center rounded-xl border-2 border-emerald-400 font-bold bg-white">
                <div id="sol7" class="hidden text-xs font-bold p-2 rounded-xl mt-2 text-left w-full"></div>
              </div>

              <!-- Q8: Ladybug with 6 Spots -->

    function evaluateWorksheet(e) {
      e.preventDefault();

      const answers = {
        q1: { correct: "1", sol: "Number 1 is represented by 1 red dot." },
        q2: { correct: "3", sol: "Number 3 is represented by 3 red dots." },
        q3: { correct: "5", sol: "There are 5 chicks (🐥)." },
        q4: { correct: "5", sol: "There are 5 eggs in the nest (🥚)." },
        q5: { correct: "5", sol: "There are 5 flowers (🌸)." },
        q6: { correct: "0", sol: "This ladybug has 0 spots." },
        q7: { correct: "4", sol: "This ladybug has 4 spots." },
        q8: { correct: "6", sol: "This ladybug has 6 spots." },
        q9: { correct: "2", sol: "This ladybug has 2 spots." }
      };

      let score = 0;
      let total = 9;

      for (let i = 1; i <= total; i++) {
        const key = 'q' + i;
        const userVal = document.getElementById(key).value.trim();
        const solEl = document.getElementById('sol' + i);
        solEl.classList.remove('hidden');

        if (userVal === answers[key].correct) {
          score++;
          solEl.className = "text-xs font-bold p-2 rounded-xl mt-2 bg-emerald-100 text-emerald-800 border border-emerald-300";
          solEl.innerHTML = `✅ Correct! ${answers[key].sol}`;
        } else {
          solEl.className = "text-xs font-bold p-2 rounded-xl mt-2 bg-red-100 text-red-800 border border-red-300";
          solEl.innerHTML = `❌ Answer is ${answers[key].correct}. ${answers[key].sol}`;
        }
      }

      if (score === total) {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        markSubtopicComplete('c1_s01');
      }
    }
