<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Econova Kids Learning 🎈</title>
  
  <!-- Google Fonts: Outfit & Quicksand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --font-main: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
      --font-heading: 'Outfit', 'Quicksand', sans-serif;
    }

    body {
      font-family: var(--font-main);
      background-color: #f0fdf4; /* Light Mint */
      color: #1f2937; /* Dark Gray */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    h1, h2, h3, .brand-logo, .hero-title, .dropbtn {
      font-family: var(--font-heading);
    }

    /* Mint Header */
    header {
      background-color: #2dd4bf; /* Mint Teal */
      border-bottom: 4px solid #10b981;
    }

    /* Logo Badge */
    .brand-logo {
      color: #fde047; /* Yellow Accent */
      text-shadow: 2px 2px 0px #059669;
    }

    /* Dropdown Button & Menu */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropbtn {
      background-color: #10b981;
      color: #ffffff;
      transition: all 0.2s ease;
    }

    .dropbtn:hover {
      background-color: #059669;
      transform: scale(1.05);
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      top: 55px;
      background-color: #ffffff;
      min-width: 200px;
      border-radius: 20px;
      border: 3px solid #34d399;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
      z-index: 1001;
    }

    .dropdown-content a {
      color: #1f2937;
      padding: 12px 20px;
      text-decoration: none;
      display: block;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.1rem;
      transition: background 0.2s ease;
      border-bottom: 2px dashed #ecfdf5;
    }

    .dropdown-content a:last-child {
      border-bottom: none;
    }

    .dropdown-content a:hover {
      background-color: #ecfdf5;
      color: #059669;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    /* Floating 3D Animation */
    .floating-3d span {
      font-family: var(--font-heading);
      font-weight: 900;
      display: inline-block;
      text-shadow: 3px 3px 0px #ffffff, 5px 5px 0px rgba(0,0,0,0.05);
    }

    .num-1 { color: #10b981; animation: float 3s ease-in-out infinite; }
    .num-a { color: #f59e0b; animation: float 3s ease-in-out 0.5s infinite; }
    .num-2 { color: #3b82f6; animation: float 3s ease-in-out 1s infinite; }
    .num-b { color: #ec4899; animation: float 3s ease-in-out 1.5s infinite; }
    .num-3 { color: #8b5cf6; animation: float 3s ease-in-out 2s infinite; }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }

    /* Custom Cards */
    .mint-card {
      background-color: #ffffff;
      border: 3px solid #34d399;
      border-radius: 24px;
    }

    .amber-card {
      background-color: #fffbeb;
      border: 3px solid #fcd34d;
      border-radius: 24px;
    }

    .mint-btn {
      background-color: #10b981;
      color: #ffffff;
      font-weight: 800;
      border-radius: 16px;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .mint-btn:hover {
      background-color: #059669;
      transform: scale(1.03);
    }
  </style>
</head>
<body class="p-0">

  <!-- Header Section -->
  <header class="p-4 sm:p-6 shadow-md flex justify-between items-center px-6 sm:px-12">
    <div class="brand-logo text-3xl sm:text-4xl font-extrabold tracking-wide">
      Econova 🎈
    </div>
    
    <!-- Class Select Dropdown -->
    <div class="dropdown">
      <button class="dropbtn px-6 py-3 rounded-2xl font-bold text-lg shadow-md flex items-center gap-2">
        CLASS ▾
      </button>
      <div class="dropdown-content">
        <a href="class-1/index.html">🎨 Class 1</a>
        <a href="class-2/index.html">🚀 Class 2</a>
        <a href="class-3/index.html">🧩 Class 3</a>
        <a href="class-4/index.html">💡 Class 4</a>
        <a href="class-5/index.html">⭐ Class 5</a>
      </div>
    </div>
  </header>

  <!-- Hero / Playground Section -->
  <main class="flex-1 flex flex-col items-center justify-center text-center p-6 space-y-6 max-w-4xl mx-auto">
    
    <div class="mint-card p-8 sm:p-12 shadow-xl w-full space-y-6">
      <h1 class="hero-title text-4xl sm:text-6xl font-black text-emerald-600">
        ECONOVA KIDS PARK! 🎈
      </h1>
      
      <p class="text-xl sm:text-2xl font-bold text-gray-700 bg-emerald-50 py-3 px-6 rounded-full inline-block border border-emerald-200">
        Click the CLASS button above to start learning!
      </p>

      <!-- Floating 3D Elements -->
      <div class="floating-3d text-5xl sm:text-7xl space-x-4 py-4">
        <span class="num-1">1</span>
        <span class="num-a">A</span>
        <span class="num-2">2</span>
        <span class="num-b">B</span>
        <span class="num-3">3</span>
      </div>

      <!-- Playful Emojis -->
      <div class="text-5xl sm:text-6xl space-x-2 filter drop-shadow-md pt-2">
        🤾‍♀️ 🧩 🏃‍♂️ 📚 🎨
      </div>
    </div>

    <!-- Quick Info Amber Card -->
    <div class="amber-card p-6 w-full text-center shadow-md">
      <h3 class="text-xl font-extrabold text-amber-800 mb-2">🌟 Interactive & Fun Learning</h3>
      <p class="font-bold text-amber-900/80">
        Select your class grade to explore interactive math worksheets, games, and video lessons!
      </p>
    </div>

  </main>

</body>
</html>
